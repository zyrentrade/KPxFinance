<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:#0D1B24}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;min-height:100vh}
#root{min-height:100dvh;min-height:100vh}
input,select,button,textarea{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}

/* ── CAPTURE-FIRST DESIGN SYSTEM ── */
:root{
  --bg:#14211C;--surface:#1C2C25;--card:#1E2E26;--bd:#304038;
  --em:#C8F135;--lime:#C8F135;--amber:#FFD092;--coral:#FF9FA7;--violet:#D9CEFF;--blue:#B9D9FF;
  --muted:#7A9488;--tx:#F3F8F2;--sub:#C0D0C8;--ink:#14211C;
  --shadow:rgba(0,0,0,.4);
  --shadow:rgba(2,12,7,.38);
  --is-mobile:1;
}

/* ── DESKTOP LIGHT TOKENS ── */
@media(min-width:700px){
  html{background:#F7F8F4}
  :root{
    --bg:#F2F2F0;--surface:#F8F8F6;--card:#FFFFFF;--bd:#E4E4E0;
    --em:#C8F135;--lime:#C8F135;--amber:#F59E0B;--coral:#EF4444;--violet:#EDE9FF;--blue:#3B82F6;
    --muted:#9CA3A0;--tx:#1A1A1A;--sub:#666666;--ink:#1A1A1A;
    --shadow:rgba(0,0,0,.06);
    --shadow:rgba(20,33,28,.09);
    --is-mobile:0;
  }
}

body{background:var(--bg);color:var(--tx)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:900;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.overlay{align-items:center;padding:1rem}}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:1.25rem;padding-bottom:max(1.25rem,env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{border-radius:16px;max-height:88vh}}

/* ── TOAST ── */
.toasts{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(360px,90vw)}
.toast{background:var(--card);border:0.5px solid var(--bd);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;color:var(--tx);box-shadow:0 4px 20px var(--shadow);animation:tin .2s ease;white-space:nowrap;border-left-width:3px}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
.toast.out{animation:tout .18s ease forwards}

/* ── CONFIRM ── */
.cbox{background:var(--card);border:0.5px solid var(--bd);border-radius:16px;padding:1.25rem;width:min(320px,90vw);box-shadow:0 8px 32px var(--shadow)}

/* ── MOBILE BOTTOM NAV ── */
.bnav{display:none}
@media(max-width:699px){

/* ── HYBRID APP SHELL ── */

.hybrid-side{background:var(--surface);border-right:1px solid var(--bd);padding:24px 15px 18px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.hybrid-brand{font-size:21px;font-weight:800;letter-spacing:-1px;color:var(--tx);padding:0 8px}.hybrid-brand b{background:var(--lime);color:var(--ink);padding:1px 5px;border-radius:5px;margin:0 2px}
.hybrid-nav{display:flex;flex-direction:column;gap:3px}.hybrid-nav button{position:relative;text-align:left;background:transparent;border:0;border-radius:10px;color:var(--muted);padding:10px 11px;font:inherit;font-size:13px;cursor:pointer}.hybrid-nav button.active{background:var(--lime);color:var(--ink);font-weight:800;border-radius:10px}.hybrid-nav button.secondary{margin-top:10px;border-top:1px solid var(--bd);border-radius:0;padding-top:18px}.hybrid-side-note{margin-top:auto;background:var(--violet);color:#4B3FA0;padding:13px;border-radius:13px;font-size:12px;line-height:1.45}.hybrid-side-note b{display:block;margin-bottom:3px}
.hybrid-main{padding:25px 30px 42px;min-width:0}.hybrid-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.hybrid-kicker{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.hybrid-title{font-size:27px;font-weight:800;letter-spacing:-1.2px;color:var(--tx);margin-top:3px}.hybrid-action{background:var(--ink);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-size:13px;font-weight:800;cursor:pointer}

/* ── DESKTOP TOP NAV ── */

@media(min-width:700px){

const nowIso=()=>new Date().toISOString();

const addM=(mk,n)=>{const[y,m]=mk.split("-").map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtN=(n,d=2)=>parseFloat(n||0).toFixed(d);
const SYM={THB:"฿",USD:"$",EUR:"€",JPY:"¥",GBP:"£",SGD:"S$"};
const fmtC=(n,c="THB")=>(SYM[c]||c+" ")+Math.abs(n||0).toLocaleString("en-US",{minimumFractionDigits:c==="THB"?0:2,maximumFractionDigits:4});
const fmt=n=>"฿"+Math.round(n||0).toLocaleString("th-TH");
const mLbl=mk=>{if(!mk)return"";const[y,m]=mk.split("-");return new Date(y,m-1,1).toLocaleDateString("th-TH",{month:"short",year:"2-digit"});};
const isMobile=()=>window.innerWidth<MOBILE_BP;
const asNum=v=>Number.isFinite(Number(v))?Number(v):0;
const baseValue=(item,fx=DEF_FX)=>asNum(item.baseAmount??(asNum(item.amount)*(asNum(item.fxRate)||asNum(fx[item.cur||BASE_CUR])||1)));
const stamp=(item={})=>({...item,updatedAt:nowIso(),revision:asNum(item.revision)+1});

/* FIFO lots: every sale consumes actual open purchase lots in date order. */
function investmentLedger(trades=[]){
  const open={},positions={},rows={},issues=[];let realizedPnl=0;
  [...trades].sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))||String(a.id).localeCompare(String(b.id))).forEach(t=>{
    const key=t.key||String(t.name||"").trim().toUpperCase();if(!key)return;
    const qty=asNum(t.qty),price=asNum(t.price),fee=asNum(t.fee),gross=asNum(t.gross)||qty*price;
    if(!(qty>0)){issues.push({id:t.id,message:"จำนวนหน่วยต้องมากกว่า 0"});return;}
    if(!open[key])open[key]=[];
    if(t.action!=="sell"){
      const cost=gross+fee;open[key].push({tradeId:t.id,qty,cost,unitCost:cost/qty,cur:t.cur||"USD",date:t.date});
      rows[t.id]={costBasis:cost,realizedPnl:null,netCash:-cost};return;
    }
    let remaining=qty,costBasis=0;
    for(const lot of open[key]){if(remaining<=1e-9)break;const take=Math.min(remaining,lot.qty);costBasis+=take*lot.unitCost;lot.qty-=take;lot.cost-=take*lot.unitCost;remaining-=take;}
    const proceeds=gross-fee;
    const pnl=proceeds-costBasis;
    rows[t.id]={costBasis,realizedPnl:pnl,netCash:proceeds,oversold:remaining>1e-9};
    realizedPnl+=pnl;
    if(remaining>1e-9)issues.push({id:t.id,message:`ขาย ${key} เกินยอดถือ ${remaining.toFixed(6)} หน่วย`});
  });
  Object.entries(open).forEach(([key,lots])=>{const kept=lots.filter(l=>l.qty>1e-9);if(!kept.length)return;const qty=kept.reduce((s,l)=>s+l.qty,0),cost=kept.reduce((s,l)=>s+l.cost,0);const first=trades.find(t=>(t.key||String(t.name||"").toUpperCase())===key)||{};positions[key]={key,name:first.name||key,type:first.type||"อื่นๆ",qty,cost,avgCost:cost/qty,cur:first.cur||"USD"};});
  return{positions:Object.values(positions),rows,issues,realizedPnl};
}
function mergeRows(local=[],remote=[]){
  const byId=new Map(local.map(x=>[x.id,x]));
  remote.forEach(r=>{if(!r?.id)return;const l=byId.get(r.id);if(!l||String(r.updatedAt||"")>=String(l.updatedAt||""))byId.set(r.id,r);});
  return [...byId.values()];
}
function mergeSyncState(local,remote){
  const arrayKeys=["incomes","expenses","installments","instPayments","ccPayments","investments","incomeSources","expCats","incCats","transfers","envelopes"];
  const out={...local,...remote};arrayKeys.forEach(k=>{if(Array.isArray(local[k])&&Array.isArray(remote[k])&&local[k].every(x=>x?.id)&&remote[k].every(x=>x?.id))out[k]=mergeRows(local[k],remote[k]);});
  return out;
}

/* ── useLS ── */
function useLS(key,init){
  const[v,setV]=useState(()=>{try{const s=localStorage.getItem(key);return s?JSON.parse(s):init;}catch{return init;}});
  const set=useCallback(fn=>{setV(p=>{const n=typeof fn==="function"?fn(p):fn;try{localStorage.setItem(key,JSON.stringify(n));}catch{}return n;});},[key]);
  return[v,set];
}

/* ── useIsMobile ── */
function useIsMobile(){
  const[m,setM]=useState(()=>window.innerWidth<MOBILE_BP);
  useEffect(()=>{const h=()=>setM(window.innerWidth<MOBILE_BP);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);
  return m;
}

/* ── Toast ── */
const TC=React.createContext(null);
function ToastProvider({children}){
  const[ts,setTs]=useState([]);
  const show=useCallback((msg,type="info",ms=2600)=>{
    const id=uid();
    setTs(p=>[...p.slice(-3),{id,msg,type}]);
    setTimeout(()=>setTs(p=>p.map(t=>t.id===id?{...t,out:true}:t)),ms-220);
    setTimeout(()=>setTs(p=>p.filter(t=>t.id!==id)),ms);
  },[]);
  const tc={ok:"var(--em)",error:"var(--coral)",warn:"var(--amber)",info:"var(--blue)"};
  return<TC.Provider value={show}>
    {children}
    <div className="toasts">{ts.map(t=><div key={t.id} className={"toast"+(t.out?" out":"")} style={{borderLeftColor:tc[t.type]||tc.info}}>{t.msg}</div>)}</div>
  </TC.Provider>;
}
const useToast=()=>React.useContext(TC);

/* ── Confirm ── */

}
function useConfirm(){

/* ── Gemini ── */
async function readSlipGemini(file,prompt){
  const key=localStorage.getItem(GEMINI_KEY)||"";
  const endpoint=localStorage.getItem(SCAN_ENDPOINT)||"";
  if(!endpoint&&!key)throw new Error("NO_KEY");
  // Convert file to base64
  const b64=await new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=er;r.readAsDataURL(file);});
  // Detect MIME — iPhone often sends empty string
  const ext=(file.name||"").split(".").pop().toLowerCase();
  const mimeMap={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp",heic:"image/jpeg",heif:"image/jpeg"};
  if(ext==="heic"||ext==="heif")throw new Error("HEIC ต้องแปลงเป็น JPG/PNG ก่อนสแกน เพื่อให้ข้อมูลถูกต้อง");
  const mime=(file.type&&file.type!=="application/octet-stream"&&file.type!=="")?file.type:(mimeMap[ext]||"image/jpeg");
  const model=localStorage.getItem(GEMINI_MODEL)||"gemini-2.5-flash";
  const requestBody={contents:[{parts:[{inline_data:{mime_type:mime,data:b64}},{text:prompt}]}],generationConfig:{responseMimeType:"application/json",maxOutputTokens:1024}};
  const res=await fetch(endpoint||`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${key}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(endpoint?{action:"scan",image:{mime,data:b64},prompt}:requestBody)
  });
  if(!res.ok){
    let msg="Gemini error "+res.status;
    try{const e=await res.json();msg=e.error?.message||msg;}catch{}
    throw new Error(msg);
  }
  const d=await res.json();
  if(endpoint){const raw=typeof d.data==="string"?d.data:typeof d.text==="string"?d.text:JSON.stringify(d.data||d);if(d.error)throw new Error(d.error);return raw.replace(/^```json\s*/i,"").replace(/^```\s*/i,"").replace(/\s*```$/," ").trim();}
  // Check for blocked content
  if(d.candidates?.[0]?.finishReason==="SAFETY")throw new Error("ภาพถูก block โดย safety filter");
  const raw=(d.candidates?.[0]?.content?.parts?.[0]?.text||"").trim();
  if(!raw)throw new Error("Gemini ไม่ส่งข้อความกลับ");
  // Strip markdown code blocks if any
  return raw.replace(/^```json\s*/i,"").replace(/^```\s*/i,"").replace(/\s*```$/,"").trim();
}

function GeminiCfg({onClose}){
  const[k,setK]=useState(()=>localStorage.getItem(GEMINI_KEY)||"");
  const[endpoint,setEndpoint]=useState(()=>localStorage.getItem(SCAN_ENDPOINT)||"");
  const toast=useToast();
  return<div style={{background:"var(--surface)",borderRadius:12,padding:14,marginBottom:12}}>

function SlipZone({onFile,state}){

  const handle=e=>{e.preventDefault();const f=e.dataTransfer?.files[0]||e.target.files[0];if(f)onFile(f);if(ref.current)ref.current.value="";};

    onDragOver={e=>{e.preventDefault();setDrag(true);}}

function Donut({slices,size=88}){
  const COLS=["var(--coral)","var(--violet)","var(--amber)","var(--em)","var(--blue)","#FF8C42"];
  const total=slices.reduce((s,x)=>s+(x.value||0),0);
  if(!total)return<div style={{width:size,height:size,borderRadius:"50%",background:"var(--bd)"}}/>;
  let off=0;const r=40,circ=2*Math.PI*r;
  return<svg width={size} height={size} viewBox="0 0 100 100">
    {slices.map((s,i)=>{const pct=s.value/total,dash=pct*circ,gap=circ-dash;
      const el=<circle key={i} cx={50} cy={50} r={r} fill="none" stroke={s.color||COLS[i%COLS.length]} strokeWidth={18}
        strokeDasharray={`${dash} ${gap}`} strokeDashoffset={-off*circ}
        style={{transform:"rotate(-90deg)",transformOrigin:"50% 50%"}}/>;off+=pct;return el;})}
    <circle cx={50} cy={50} r={31} fill="var(--card)"/>
  </svg>;
}

function SheetsSync({getState,setAll,setSS}){
  const[url,setUrl]=useState(()=>localStorage.getItem(SHEETS_URL)||"");
  const[cfg,setCfg]=useState(false);
  const[saving,setSaving]=useState(false);
  const toast=useToast();
  const ref=useRef();ref.current=getState;

  const sync=useCallback(async(dir,silent=false)=>{
    const ep=localStorage.getItem(SHEETS_URL);
    if(!ep){if(!silent)setCfg(true);return;}
    setSS("syncing");
    try{
      if(dir==="push"){
        const r=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({v:10,mode:"merge",syncCursor:localStorage.getItem(LAST_PUSH)||"",...ref.current(),pushedAt:nowIso()})});
        const d=await r.json();if(d.error)throw new Error(d.error);
        localStorage.setItem(LAST_PUSH,nowIso());
        setSS("ok");setTimeout(()=>setSS("idle"),2500);
        if(!silent)toast("✅ Push สำเร็จ","ok");
      }else{
        const r=await fetch(ep+"?ts="+Date.now());
        const d=await r.json();if(d.error)throw new Error(d.error);
        const shTs=d.pushedAt||"",lcTs=localStorage.getItem(LAST_PUSH)||"";
        if(!silent&&shTs&&lcTs&&shTs<=lcTs){toast("Sheets เก่ากว่า local — ไม่ overwrite","warn");setSS("idle");return;}
        setAll(mergeSyncState(ref.current(),d));localStorage.setItem(LAST_PUSH,shTs||nowIso());
        setSS("ok");setTimeout(()=>setSS("idle"),2500);
        if(!silent)toast("✅ Pull สำเร็จ","ok");
      }
    }catch(e){setSS("error");setTimeout(()=>setSS("idle"),4000);if(!silent)toast("❌ "+e.message,"error");}
  },[setSS,toast]);

  useEffect(()=>{if(!localStorage.getItem(SHEETS_URL))return;const t=setInterval(()=>sync("push",true),AUTO_MS);return()=>clearInterval(t);},[sync]);
  const pulled=useRef(false);
  useEffect(()=>{if(pulled.current||!localStorage.getItem(SHEETS_URL))return;pulled.current=true;setTimeout(()=>sync("pull",true),900);},[sync]);

  const saveUrl=()=>{localStorage.setItem(SHEETS_URL,url.trim());setSaving(true);setTimeout(()=>{setSaving(false);setCfg(false);sync("pull",false);},400);};

  return<div style={{position:"relative"}}>
    <div style={{display:"flex",gap:5,alignItems:"center"}}>
      <Btn sm col="var(--em)" style={{color:"var(--ink)"}} onClick={()=>sync("push")}>⬆</Btn>
      <Btn sm col="var(--blue)" onClick={()=>sync("pull")}>⬇</Btn>
      <IBtn onClick={()=>setCfg(p=>!p)} title="ตั้งค่า">⚙</IBtn>
      <span style={{fontSize:9,color:"var(--muted)"}}>merge / 5m</span>
    </div>
    {cfg&&<div style={{position:"absolute",top:"110%",right:0,background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:14,width:"min(340px,90vw)",zIndex:200,boxShadow:"0 6px 24px var(--shadow)"}}>
      <div style={{fontSize:12,fontWeight:700,color:"var(--tx)",marginBottom:6}}>Apps Script URL</div>
      <div style={{fontSize:11,color:"var(--muted)",marginBottom:8,lineHeight:1.5}}>
        ใช้ Apps Script ที่รองรับ v10 record merge เท่านั้น · หลีกเลี่ยง endpoint แบบ snapshot ทับทั้งก้อน<br/>ใช้ LockService และตรวจ syncCursor ก่อนเขียน
      </div>
      <Inp placeholder="https://script.google.com/macros/s/..." value={url} onChange={e=>setUrl(e.target.value)} style={{marginBottom:8,fontSize:12}}/>
      <div style={{display:"flex",gap:6}}>
        <Btn sm col="var(--em)" style={{color:"var(--ink)"}} onClick={saveUrl}>{saving?"✓ Saved!":"บันทึก + Pull"}</Btn>
        <Btn sm col="var(--bd)" style={{color:"var(--sub)"}} onClick={()=>setCfg(false)}>ยกเลิก</Btn>
      </div>
    </div>}
  </div>;
}

    const exps=expenses.map(e=>({...e,_type:"exp",_date:e.month+"-01"}));
    const incs=incomes.map(e=>({...e,_type:"inc",_date:e.month+"-01"}));
    return[...exps,...incs].sort((a,b)=>b._date.localeCompare(a._date)).slice(0,5);
  },[expenses,incomes]);

  const[slipErr,setSlipErr]=useState("");
  const readSlip=async file=>{
    if(!localStorage.getItem(GEMINI_KEY)&&!localStorage.getItem(SCAN_ENDPOINT)){setSlipSt("nokey");setShowKey(true);return;}
    setSlipSt("loading");setSlipErr("");
    try{
      const prompt='Look at this financial slip/receipt image carefully. Return ONLY a JSON object, no markdown, no explanation. Detect if it is an investment/stock trade or an expense. JSON format: {"_slipType":"invest or expense","desc":"description","amount":number,"date":"YYYY-MM-DD","category":"food/transport/utility/entertainment/health/education/shopping/other","cur":"THB or USD","action":"buy or sell","type":"stock/gold/fund/crypto/other","name":"asset name if investment","qty":quantity_number,"price":price_per_unit_number,"fee":fee_number,"totalCost":total_amount_number}';
      const raw=await readSlipGemini(file,prompt);
      let d;
      try{d=JSON.parse(raw);}catch{throw new Error("Gemini ตอบไม่ใช่ JSON: "+raw.slice(0,80));}
      if(d._slipType==="invest"||d.action||d.name){
        const p={id:uid(),source:"invest",action:d.action||"buy",type:d.type||"หุ้น",name:d.name||d.desc||"",date:d.date||today(),qty:parseFloat(d.qty)||0,price:parseFloat(d.price)||0,fee:parseFloat(d.fee)||0,totalCost:parseFloat(d.totalCost||d.amount)||0,cur:d.cur||"USD",createdAt:nowIso()};
        setPendingItems(p2=>[...p2,p]);setSlipSt("ok");setPendMdl({...p,_mode:"invest"});
      }else{
        const p={id:uid(),source:"expense",desc:d.desc||"",amount:parseFloat(d.amount)||0,totalCost:parseFloat(d.amount)||0,date:d.date||today(),category:d.category||"อื่นๆ",cur:d.cur||"THB",month:d.date?d.date.slice(0,7):thisMonth(),createdAt:nowIso()};
        setPendingItems(p2=>[...p2,p]);setSlipSt("ok");setPendMdl({...p,_mode:"expense"});
      }
    }catch(err){
      const msg=err.message==="NO_KEY"?"nokey":"error";
      setSlipSt(msg);setSlipErr(err.message||"");
      if(err.message==="NO_KEY")setShowKey(true);
    }
  };

  const ref=useRef();
  const handleFile=e=>{const f=e.target.files[0];if(f)readSlip(f);e.target.value="";};

  return<div style={{display:"flex",flexDirection:"column",gap:0}}>
    {pendMdl&&pendMdl._mode==="expense"&&<PendExpModal item={pendMdl} pockets={pockets} setPockets={setPockets} setExpenses={setExpenses} setInstallments={setInstallments} onClose={()=>{setPendingItems(p=>p.filter(x=>x.id!==pendMdl.id));setPendMdl(null);}}/>}
    {pendMdl&&pendMdl._mode==="invest"&&<PendInvModal item={pendMdl} pockets={pockets} setPockets={setPockets} investments={investments} setInvestments={setInvestments} savedNames={savedNames} setSavedNames={setSavedNames} onClose={()=>{setPendingItems(p=>p.filter(x=>x.id!==pendMdl.id));setPendMdl(null);}}/>}
    {/* Capture-first command centre */}
    <div style={{background:"var(--surface)",padding:"18px 16px 16px",margin:"0 -12px 12px",borderBottom:"1px solid var(--bd)"}}>
      <div style={{fontSize:11,color:"var(--muted)",marginBottom:5,letterSpacing:".05em",fontWeight:700}}>วันนี้ · {new Date().toLocaleDateString("th-TH",{day:"numeric",month:"long"})}</div>
      <div style={{fontSize:25,fontWeight:800,color:"var(--tx)",letterSpacing:"-.7px",marginBottom:13}}>บันทึกอะไรเกิดขึ้น?</div>
      <div style={{background:"var(--em)",borderRadius:16,padding:"14px",color:"var(--ink)",cursor:"pointer"}} onClick={()=>ref.current?.click()}>
        <input ref={ref} type="file" accept="image/*,image/heic,image/heif" style={{display:"none"}} onChange={handleFile}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontWeight:800,fontSize:15}}>📷 สแกน Slip หรือแนบรูป</div><div style={{fontSize:11,marginTop:3,opacity:.72}}>AI จะสร้างร่างรายการให้คุณตรวจ</div></div><span style={{fontSize:22}}>›</span></div>
        {slipSt==="loading"&&<span style={{fontSize:10,opacity:.7}} className="syncing">กำลังอ่าน...</span>}
        {slipSt==="ok"&&<span style={{fontSize:10,opacity:.7}}>✓ อ่านสำเร็จ</span>}
        {slipSt==="error"&&<span style={{fontSize:10,opacity:.7}}>❌ ลองใหม่</span>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:8}}>
        <button onClick={()=>setTab("expense")} style={{background:"var(--card)",border:"1px solid var(--bd)",borderRadius:11,padding:"11px",color:"var(--tx)",fontWeight:700,fontSize:12,cursor:"pointer"}}>− รายจ่าย</button>
        <button onClick={()=>setTab("income")} style={{background:"var(--card)",border:"1px solid var(--bd)",borderRadius:11,padding:"11px",color:"var(--tx)",fontWeight:700,fontSize:12,cursor:"pointer"}}>+ รายรับ</button>
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:12}}>
      <div style={{background:"var(--mint)",borderRadius:14,padding:"13px",background:"var(--em)",color:"var(--ink)"}}><div style={{fontSize:10,opacity:.7,marginBottom:5}}>ใช้ได้จริงเดือนนี้</div><div style={{fontSize:22,fontWeight:800,letterSpacing:"-.7px"}}>{fmt(disp)}</div></div>
      <div style={{background:"var(--card)",border:"1px solid var(--bd)",borderRadius:14,padding:"13px"}}><div style={{fontSize:10,color:"var(--muted)",marginBottom:5}}>เงินที่ยังไม่จัดสรร</div><div style={{fontSize:22,fontWeight:800,color:"var(--tx)",letterSpacing:"-.7px"}}>{fmt(mainPk?.amount||0)}</div></div>
    </div>

    {showKey&&<div style={{marginBottom:10}}><GeminiCfg onClose={()=>setShowKey(false)}/></div>}
    {slipErr&&slipSt==="error"&&<div style={{background:"var(--coral)18",border:"0.5px solid var(--coral)50",borderRadius:10,padding:"8px 12px",marginBottom:10,fontSize:11,color:"var(--coral)"}}>{slipErr}</div>}

    {/* Pending alert */}
    {totalPend>0&&<div style={{background:"var(--amber)18",border:"0.5px solid var(--amber)50",borderRadius:12,padding:"10px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setTab(pendingExp.length?"expense":"invest")}>
      <span style={{background:"var(--amber)",color:"var(--ink)",borderRadius:99,fontSize:11,fontWeight:700,padding:"1px 7px",minWidth:22,textAlign:"center"}}>{totalPend}</span>
      <span style={{fontSize:13,color:"var(--amber)",fontWeight:600}}>slip รอยืนยัน — แตะเพื่อดู</span>
    </div>}

    {/* Recent */}
    <div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,overflow:"hidden",marginBottom:10}}>
      <div style={{padding:"10px 14px",borderBottom:"0.5px solid var(--bd)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <SL style={{margin:0}}>รายการล่าสุด</SL>
        <span style={{fontSize:11,color:"var(--blue)",cursor:"pointer"}} onClick={()=>setTab("expense")}>ดูทั้งหมด</span>
      </div>
      {recent.length===0&&<div style={{padding:"1.5rem",textAlign:"center",color:"var(--muted)",fontSize:13}}>ยังไม่มีรายการ</div>}
      {recent.map((r,i)=><div key={r.id} style={{padding:"10px 14px",display:"flex",alignItems:"center",gap:10,borderBottom:i<recent.length-1?"0.5px solid var(--bd)":"none"}}>
        <div style={{width:32,height:32,borderRadius:9,background:r._type==="inc"?"var(--em)20":"var(--coral)20",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
          {r._type==="inc"?"💚":"💸"}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:600,color:"var(--tx)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.desc||r.category}</div>
          <div style={{fontSize:11,color:"var(--muted)"}}>{r.category||""} · {r.month}</div>
        </div>
        <span style={{fontSize:13,fontWeight:700,color:r._type==="inc"?"var(--em)":"var(--coral)",flexShrink:0}}>
          {r._type==="inc"?"+":"-"}{fmtC(r.amount,r.cur||"THB")}
        </span>
      </div>)}
    </div>

    {/* Pocket mini */}
    <div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"12px 14px",marginBottom:10}}>
      <SL>Cloud Pockets</SL>
      {pockets.slice(0,4).map((pk,i)=>{
        const isT=pk.id===TRADER_PID||pk.name==="TRADER";
        const COLS=["var(--em)","var(--blue)","var(--amber)","var(--violet)","var(--coral)"];
        const col=isT?"var(--blue)":COLS[i%COLS.length];
        const pct=pk.goal>0?clamp(Math.round(pk.amount/pk.goal*100),0,100):null;
        return<div key={pk.id} style={{marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
            <span style={{fontSize:12,color:"var(--sub)"}}>{isT?"💹 ":""}{pk.name}</span>
            <span style={{fontSize:13,fontWeight:600,color:col}}>{isT?fmtC(pk.amount,"USD"):fmt(pk.amount)}</span>
          </div>
          {pct!==null&&<PBar pct={pct} col={col}/>}
          {pct===null&&<div style={{height:3,background:"var(--bd)",borderRadius:2}}><div style={{height:3,background:col,width:"100%",borderRadius:2,opacity:.3}}/></div>}
        </div>;
      })}
      <div style={{cursor:"pointer",textAlign:"center",fontSize:12,color:"var(--blue)",marginTop:6}} onClick={()=>setTab("saving")}>จัดการ Pockets →</div>
    </div>
  </div>;
}

/* ══════════════════════════════════════
   DESKTOP OVERVIEW
══════════════════════════════════════ */
function DesktopOverview({incomes,expenses,installments,instPayments,pockets}){
  const[vm,setVm]=useState(thisMonth());
  const instDue=useMemo(()=>installments.filter(i=>{const[sy,sm]=i.startMonth.split("-").map(Number);const[vy,vm2]=vm.split("-").map(Number);const d=(vy-sy)*12+(vm2-sm);return d>=0&&d<i.totalMonths;}),[installments,vm]);
  const inc=useMemo(()=>incomes.filter(e=>e.month===vm).reduce((s,e)=>s+e.amount,0),[incomes,vm]);
  const exp=useMemo(()=>expenses.filter(e=>e.month===vm).reduce((s,e)=>s+e.amount,0),[expenses,vm]);
  const instTot=instDue.reduce((s,i)=>s+i.monthly,0);
  const ccDue=useMemo(()=>{const p=addM(vm,-1);return expenses.filter(e=>e.month===p&&e.payMethod==="บัตรเครดิต"&&e.ccDeferred).reduce((s,e)=>s+e.amount,0);},[expenses,vm]);
  const disp=inc-exp-instTot-ccDue;
  const totSav=pockets.reduce((s,p)=>s+p.amount,0);
  const sr=inc>0?clamp(Math.round(disp/inc*100),0,100):0;
  const COLS=["var(--coral)","var(--violet)","var(--amber)","var(--em)","var(--blue)","#FF8C42"];
  const expCats=useMemo(()=>{const m={};expenses.filter(e=>e.month===vm).forEach(e=>{m[e.category]=(m[e.category]||0)+e.amount;});instDue.forEach(i=>{m["ผ่อนชำระ"]=(m["ผ่อนชำระ"]||0)+i.monthly;});return m;},[expenses,instDue,vm]);
  const barData=useMemo(()=>Array.from({length:5},(_,i)=>{
    const mk=addM(vm,i-2);
    const ii=incomes.filter(e=>e.month===mk).reduce((s,e)=>s+e.amount,0);
    const ee=expenses.filter(e=>e.month===mk).reduce((s,e)=>s+e.amount,0);
    const iD=installments.filter(inst=>{const[sy,sm]=inst.startMonth.split("-").map(Number);const[vy,v2]=mk.split("-").map(Number);const d=(vy-sy)*12+(v2-sm);return d>=0&&d<inst.totalMonths;}).reduce((s,i)=>s+i.monthly,0);
    return{label:mLbl(mk),inc:ii,exp:ee+iD};
  }),[incomes,expenses,installments,vm]);

  // Recent 6
  const recent=useMemo(()=>{
    const arr=[...expenses.map(e=>({...e,_t:"exp"})),...incomes.map(e=>({...e,_t:"inc"}))];
    return arr.sort((a,b)=>b.month.localeCompare(a.month)).slice(0,6);
  },[expenses,incomes]);

  return<div style={{display:"flex",flexDirection:"column",gap:14}}>
    {/* Month nav */}
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <IBtn onClick={()=>setVm(m=>addM(m,-1))}>‹</IBtn>
      <span style={{fontWeight:700,fontSize:16,minWidth:90,textAlign:"center",color:"var(--tx)"}}>{mLbl(vm)}</span>
      <IBtn onClick={()=>setVm(m=>addM(m,1))}>›</IBtn>
      <Btn sm col="var(--surface)" style={{color:"var(--sub)",border:"1px solid var(--bd)"}} onClick={()=>setVm(thisMonth())}>เดือนนี้</Btn>
    </div>

    {/* KPI 5 col */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10}}>
      {[
        {label:"รายรับ",val:fmt(inc),col:"var(--em)",sub:`เดือน ${mLbl(vm)}`},
        {label:"รายจ่าย",val:fmt(exp),col:"var(--coral)",sub:`${Object.keys(expCats).length} หมวด`},
        {label:"ผ่อน + CC",val:fmt(instTot+ccDue),col:"var(--amber)",sub:`${instDue.length} รายการ`},
        {label:"เงินเก็บรวม",val:fmt(totSav),col:"var(--violet)",sub:`${pockets.length} pockets`},
        {label:"ใช้ได้จริง",val:fmt(disp),col:disp>=0?"var(--em)":"var(--coral)",sub:`อัตราออม ${sr}%`,hi:true},
      ].map(k=><div key={k.label} style={{background:k.hi?"var(--em)12":k.col+"10",border:`0.5px solid ${k.hi?"var(--em)":"var(--bd)"}30`,borderRadius:12,padding:"12px 14px"}}>
        <div style={{fontSize:10,color:k.hi?"var(--em)":"var(--muted)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:6}}>{k.label}</div>
        <div style={{fontSize:20,fontWeight:600,color:k.col,lineHeight:1.1}}>{k.val}</div>
        <div style={{fontSize:10,color:"var(--muted)",marginTop:3}}>{k.sub}</div>
      </div>)}
    </div>

    {/* 3-col grid */}
    <div style={{display:"grid",gridTemplateColumns:"1.5fr 1fr 0.9fr",gap:12}}>
      {/* Chart */}
      <Card>
        <SL>รายรับ vs รายจ่าย (5 เดือน)</SL>
        <MiniBar data={barData}/>
        <div style={{display:"flex",gap:14,marginTop:8}}>
          <span style={{fontSize:11,color:"var(--em)"}}>● รายรับ</span>
          <span style={{fontSize:11,color:"var(--coral)"}}>● รายจ่าย</span>
        </div>
      </Card>

      {/* Recent transactions */}
      <Card style={{padding:0,overflow:"hidden"}}>
        <div style={{padding:"10px 14px",borderBottom:"0.5px solid var(--bd)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <SL style={{margin:0}}>รายการล่าสุด</SL>
        </div>
        {recent.map((r,i)=><div key={r.id} style={{padding:"9px 14px",display:"flex",alignItems:"center",gap:10,borderBottom:i<recent.length-1?"0.5px solid var(--bd)":"none"}}>
          <div style={{width:28,height:28,borderRadius:8,background:r._t==="inc"?"var(--em)20":"var(--coral)20",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>
            {r._t==="inc"?"💚":"💸"}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:12,fontWeight:600,color:"var(--tx)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.desc||r.category}</div>
            <div style={{fontSize:10,color:"var(--muted)"}}>{r.month}</div>
          </div>
          <span style={{fontSize:12,fontWeight:700,color:r._t==="inc"?"var(--em)":"var(--coral)",flexShrink:0}}>
            {r._t==="inc"?"+":"-"}{fmtC(r.amount,r.cur||"THB")}
          </span>
        </div>)}
        {!recent.length&&<div style={{padding:"1.5rem",textAlign:"center",color:"var(--muted)",fontSize:13}}>ยังไม่มีรายการ</div>}
      </Card>

      {/* Pockets */}
      <Card>
        <SL>Cloud Pockets</SL>
        {pockets.slice(0,5).map((pk,i)=>{
          const isT=pk.id===TRADER_PID||pk.name==="TRADER";
          const C2=["var(--em)","var(--blue)","var(--amber)","var(--violet)","var(--coral)"];
          const col=isT?"var(--blue)":C2[i%C2.length];
          const pct=pk.goal>0?clamp(Math.round(pk.amount/pk.goal*100),0,100):null;
          return<div key={pk.id} style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
              <span style={{fontSize:11,color:"var(--sub)"}}>{isT?"💹 ":""}{pk.name}</span>
              <span style={{fontSize:11,fontWeight:600,color:col}}>{isT?fmtC(pk.amount,"USD"):fmt(pk.amount)}</span>
            </div>
            {pct!==null?<PBar pct={pct} col={col}/>:<div style={{height:3,background:col+"30",borderRadius:2}}/>}
          </div>;
        })}
        <div style={{marginTop:10,paddingTop:10,borderTop:"0.5px solid var(--bd)"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
            <span style={{fontSize:11,color:"var(--muted)"}}>อัตราออม</span>
            <span style={{fontSize:12,fontWeight:600,color:sr>=20?"var(--em)":sr>=10?"var(--amber)":"var(--coral)"}}>{sr}%</span>
          </div>
          <PBar pct={sr} col={sr>=20?"var(--em)":sr>=10?"var(--amber)":"var(--coral)"}/>
        </div>
      </Card>
    </div>

    {/* Expense breakdown */}
    {Object.keys(expCats).length>0&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <Card>
        <SL>สัดส่วนรายจ่าย</SL>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <Donut slices={Object.entries(expCats).map(([k,v],i)=>({value:v,color:COLS[i%COLS.length]}))} size={90}/>
          <div style={{flex:1}}>{Object.entries(expCats).map(([k,v],i)=><div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}><span style={{color:COLS[i%COLS.length]}}>● {k}</span><span style={{color:"var(--muted)"}}>{fmt(v)}</span></div>)}</div>
        </div>
      </Card>
      {instDue.length>0&&<Card>
        <SL>ยอดผ่อนเดือนนี้</SL>
        {instDue.map(inst=>{const[sy,sm]=inst.startMonth.split("-").map(Number);const[vy,vm2]=vm.split("-").map(Number);const paid=(vy-sy)*12+(vm2-sm)+1;const isPaid=instPayments.some(p=>p.instId===inst.id&&p.month===vm);
          return<div key={inst.id} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:13,color:"var(--tx)"}}>{inst.name}</span><div style={{display:"flex",alignItems:"center",gap:8}}>{isPaid?<Badge label="✓" color="var(--em)"/>:<Badge label="ค้าง" color="var(--amber)"/>}<span style={{fontWeight:600,color:"var(--amber)"}}>{fmt(inst.monthly)}</span></div></div><PBar pct={Math.round(paid/inst.totalMonths*100)} col={isPaid?"var(--em)":"var(--amber)"}/></div>;
        })}
      </Card>}
    </div>}
  </div>;
}

/* ══════════════════════════════════════
   INCOME TAB
══════════════════════════════════════ */
function IncomeTab({incomes,setIncomes,cats,setCats,pockets,setPockets,currencies,incomeSources,setIncomeSources,fxRates}){
  const toast=useToast();const{ask,Dialog}=useConfirm();
  const[f,setF]=useState({cat:cats[0]||"เงินเดือน",sourceId:"",desc:"",amount:"",month:thisMonth(),cur:"THB"});
  const[showCM,setSCM]=useState(false);const[search,setSearch]=useState("");const[srcFilter,setSrcFilter]=useState("all");const[newSource,setNewSource]=useState("");
  const mainPk=pockets.find(p=>p.isMain);
  const sourceName=id=>incomeSources.find(s=>s.id===id)?.name||"ไม่ระบุแหล่ง";
  const add=()=>{
    if(!f.sourceId||!f.amount){toast("เลือกแหล่งรายได้และกรอกจำนวนเงิน","warn");return;}
    const amt=parseFloat(f.amount);
    const rate=asNum(fxRates[f.cur])||1;
    setIncomes(p=>[...p,stamp({id:uid(),category:f.cat,sourceId:f.sourceId,desc:f.desc,amount:amt,cur:f.cur,fxRate:rate,baseAmount:amt*rate,month:f.month,occurredOn:f.month+"-01"})]);
    if(mainPk)setPockets(p=>p.map(pk=>pk.isMain?{...pk,amount:pk.amount+amt}:pk));
    toast("✅ เพิ่มรายรับ","ok");setF(p=>({...p,desc:"",amount:""}));
  };
  const del=async e=>{
    const ok=await ask(`ลบ "${e.desc}" ${fmtC(e.amount,e.cur||"THB")}?`);
    if(!ok)return;
    if(mainPk)setPockets(p=>p.map(pk=>pk.isMain?{...pk,amount:Math.max(0,pk.amount-e.amount)}:pk));
    setIncomes(p=>p.filter(x=>x.id!==e.id));toast("ลบแล้ว","ok");
  };
  const filtered=useMemo(()=>[...incomes].reverse().filter(e=>(srcFilter==="all"||e.sourceId===srcFilter)&&(!search||e.desc?.includes(search)||e.category.includes(search)||sourceName(e.sourceId).includes(search))),[incomes,search,srcFilter,incomeSources]);
  const addSource=()=>{const name=newSource.trim();if(!name)return;if(incomeSources.some(s=>s.name.toLowerCase()===name.toLowerCase())){toast("มีแหล่งรายได้นี้แล้ว","warn");return;}const s=stamp({id:uid(),name,active:true});setIncomeSources(p=>[...p,s]);setF(p=>({...p,sourceId:s.id}));setNewSource("");toast("เพิ่มแหล่งรายได้แล้ว","ok");};
  return<div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
    {Dialog}
    <Card>
      <SL>เพิ่มรายรับ</SL>
      <div className="fg2" style={{marginBottom:10}}>
        <FW label="หมวดหมู่"><Sel value={f.cat} onChange={e=>setF(p=>({...p,cat:e.target.value}))}>{cats.map(c=><option key={c}>{c}</option>)}</Sel></FW>
        <FW label="แหล่งรายได้"><Sel value={f.sourceId} onChange={e=>setF(p=>({...p,sourceId:e.target.value}))}><option value="">เลือกแหล่ง</option>{incomeSources.filter(s=>s.active!==false).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</Sel></FW>
        <FW label="รายละเอียด (ไม่บังคับ)"><Inp placeholder="เช่น งวด ก.ค. / โปรเจกต์ A" value={f.desc} onChange={e=>setF(p=>({...p,desc:e.target.value}))}/></FW>
        <FW label="จำนวนเงิน"><div style={{display:"flex",gap:6}}><Inp type="number" placeholder="0" value={f.amount} onChange={e=>setF(p=>({...p,amount:e.target.value}))} style={{flex:1}}/><CSel value={f.cur} onChange={v=>setF(p=>({...p,cur:v}))} currencies={currencies}/></div></FW>
        <FW label="เดือน"><Inp type="month" value={f.month} onChange={e=>setF(p=>({...p,month:e.target.value}))}/></FW>
      </div>
      {mainPk&&<div style={{fontSize:12,color:"var(--em)",marginBottom:10}}>💡 เงินจะเข้า "{mainPk.name}" อัตโนมัติ</div>}
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <Btn col="var(--em)" style={{color:"var(--ink)"}} onClick={add}>+ เพิ่มรายรับ</Btn>
        <Btn col="var(--surface)" style={{color:"var(--sub)",border:"1px solid var(--bd)"}} onClick={()=>setSCM(p=>!p)}>จัดการหมวดหมู่</Btn>
      </div>
      {showCM&&<CatMgr cats={cats} setCats={setCats}/>} 
    </Card>
    <Card>
      <SL>แหล่งรายได้ที่จำไว้</SL>
      <div style={{display:"flex",gap:6,marginBottom:10}}><Inp value={newSource} placeholder="เช่น บริษัท A / ลูกค้า B" onChange={e=>setNewSource(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addSource();}}/><Btn sm col="var(--em)" style={{color:"var(--ink)"}} onClick={addSource}>+ เพิ่ม</Btn></div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{incomeSources.map(s=><span key={s.id} style={{display:"inline-flex",alignItems:"center",gap:3,background:"var(--surface)",border:"1px solid var(--bd)",borderRadius:99,padding:"3px 8px",fontSize:11,color:"var(--tx)"}}>{s.name}<IBtn title="ลบแหล่งรายได้" danger onClick={()=>{if(incomes.some(i=>i.sourceId===s.id)){toast("แหล่งนี้มีรายการอยู่ จึงลบไม่ได้","warn");return;}setIncomeSources(p=>p.filter(x=>x.id!==s.id));}}>✕</IBtn></span>)}</div>
    </Card>
    <Card>
      <div style={{display:"flex",gap:8,marginBottom:10,alignItems:"center",flexWrap:"wrap"}}>
        <SL style={{margin:0}}>รายรับทั้งหมด ({incomes.length})</SL>
        <Sel value={srcFilter} onChange={e=>setSrcFilter(e.target.value)} style={{width:150,padding:"6px 8px",fontSize:12}}><option value="all">ทุกแหล่ง</option>{incomeSources.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</Sel>
        <Inp placeholder="🔍 ค้นหา" value={search} onChange={e=>setSearch(e.target.value)} style={{maxWidth:180,padding:"6px 10px",fontSize:12}}/>
      </div>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr><TH>เดือน</TH><TH>หมวด</TH><TH>แหล่ง</TH><TH>รายละเอียด</TH><TH right>จำนวน</TH><TH></TH></tr></thead>
        <tbody>
          {filtered.map(e=><tr key={e.id}><TD style={{fontSize:11,color:"var(--muted)"}}>{e.month}</TD><TD><Badge label={e.category} color="var(--em)"/></TD><TD>{sourceName(e.sourceId)}</TD><TD>{e.desc||"—"}</TD><TD right style={{color:"var(--em)",fontWeight:600}}>{fmtC(e.amount,e.cur||"THB")}</TD><TD><IBtn onClick={()=>del(e)} danger>🗑</IBtn></TD></tr>)}
          {!filtered.length&&<ERow cols={6} msg={search?"ไม่พบ":"ยังไม่มีข้อมูล"}/>}
        </tbody>
      </table></div>
    </Card>
  </div>;
}

/* ══════════════════════════════════════
   EXPENSE TAB
══════════════════════════════════════ */
function ExpenseTab({expenses,setExpenses,expCats,setExpCats,installments,setInstallments,instPayments,setInstPayments,ccPayments,setCcPayments,pockets,setPockets,currencies,pendingItems,setPendingItems,fxRates}){
  const toast=useToast();const{ask,Dialog}=useConfirm();
  const[f,setF]=useState({cat:expCats[0]||"อาหาร",desc:"",amount:"",month:thisMonth(),cur:"THB",pid:"",isInst:false,monthly:"",totalM:""});
  const[vm,setVm]=useState(thisMonth());
  const[showCM,setSCM]=useState(false);
  const[payModal,setPayModal]=useState(null);
  const[slipSt,setSlipSt]=useState(null);
  const[showKey,setShowKey]=useState(false);
  const[pendMdl,setPendMdl]=useState(null);
  const[search,setSearch]=useState("");

  const add=()=>{
    if(!f.desc||!f.amount){toast("กรุณากรอกข้อมูล","warn");return;}
    const amt=parseFloat(f.amount);
    if(f.isInst){
      if(!f.monthly||!f.totalM){toast("กรุณากรอกยอดผ่อนและงวด","warn");return;}
      setInstallments(p=>[...p,{id:uid(),name:f.desc,category:f.cat,totalAmount:amt,monthly:parseFloat(f.monthly),totalMonths:parseInt(f.totalM),startMonth:f.month,cur:f.cur}]);
      toast("✅ บันทึกยอดผ่อน","ok");
    }else{
      const sp=f.pid?pockets.find(p=>p.id===f.pid):null;
      const rate=asNum(fxRates[f.cur])||1;
      setExpenses(p=>[...p,stamp({id:uid(),category:f.cat,desc:f.desc,amount:amt,baseAmount:amt*rate,fxRate:rate,month:f.month,cur:f.cur,payMethod:sp?sp.name:"เงินสด",payPocketId:f.pid||"",ccDeferred:false})]);
      if(sp)setPockets(p=>p.map(x=>x.id===sp.id?{...x,amount:Math.max(0,x.amount-amt)}:x));
      toast("✅ บันทึกรายจ่าย","ok");
    }
    setF(p=>({...p,desc:"",amount:"",monthly:"",totalM:"",isInst:false,pid:""}));
  };

  const delExp=async e=>{
    const ok=await ask(`ลบ "${e.desc}" ${fmtC(e.amount,e.cur||"THB")}?`);
    if(!ok)return;
    if(e.payPocketId){const pk=pockets.find(p=>p.id===e.payPocketId);if(pk)setPockets(p=>p.map(x=>x.id===pk.id?{...x,amount:x.amount+e.amount}:x));}
    setExpenses(p=>p.filter(x=>x.id!==e.id));toast("ลบแล้ว","ok");
  };

  const readSlip=async file=>{
    if(!localStorage.getItem(GEMINI_KEY)&&!localStorage.getItem(SCAN_ENDPOINT)){setSlipSt("nokey");setShowKey(true);return;}
    setSlipSt("loading");
    try{
      const prompt='วิเคราะห์ slip ค่าใช้จ่ายนี้ ตอบ JSON เท่านั้น ไม่มี markdown: {"desc":"รายละเอียด","amount":จำนวนเงิน,"date":"YYYY-MM-DD","category":"อาหาร/เดินทาง/สาธารณูปโภค/ความบันเทิง/สุขภาพ/การศึกษา/ช้อปปิ้ง/อื่นๆ","cur":"THB/USD"}';
      const raw=await readSlipGemini(file,prompt);
      const d=JSON.parse(raw);
      const p={id:uid(),source:"expense",desc:d.desc||"",amount:d.amount||0,totalCost:d.amount||0,date:d.date||today(),category:d.category||"อื่นๆ",cur:d.cur||"THB",month:d.date?d.date.slice(0,7):thisMonth(),createdAt:nowIso()};
      setPendingItems(p2=>[...p2,p]);setSlipSt("ok");setPendMdl(p);
    }catch(err){setSlipSt(err.message==="NO_KEY"?"nokey":"error");if(err.message==="NO_KEY")setShowKey(true);}
  };

  const instDue=useMemo(()=>installments.filter(i=>{const[sy,sm]=i.startMonth.split("-").map(Number);const[vy,v2]=vm.split("-").map(Number);const d=(vy-sy)*12+(v2-sm);return d>=0&&d<i.totalMonths;}),[installments,vm]);
  const ccDue=useMemo(()=>{const p=addM(vm,-1);return expenses.filter(e=>e.month===p&&e.payMethod==="บัตรเครดิต"&&e.ccDeferred);},[expenses,vm]);
  const ccTotal=ccDue.reduce((s,e)=>s+e.amount,0);
  const ccPaid=ccPayments.some(p=>p.month===vm);
  const expPend=pendingItems.filter(x=>x.source==="expense");
  const filteredExp=useMemo(()=>expenses.filter(e=>e.month===vm&&(!search||e.desc.includes(search)||e.category.includes(search))),[expenses,vm,search]);

  const doPay=m=>{
    if(!m.from){toast("เลือก Pocket","warn");return;}
    const pk=pockets.find(p=>p.id===m.from);
    if(!pk||pk.amount<m.amount){toast("เงินไม่พอ","error");return;}
    setPockets(p=>p.map(x=>x.id===m.from?{...x,amount:Math.max(0,x.amount-m.amount)}:x));
    if(m.type==="inst")setInstPayments(p=>[...p,{id:uid(),instId:m.id,month:vm,amount:m.amount,fromPocketId:m.from,date:today()}]);
    else setCcPayments(p=>[...p,{id:uid(),month:vm,amount:m.amount,fromPocketId:m.from,date:today()}]);
    toast("✅ ชำระเรียบร้อย","ok");setPayModal(null);
  };

  return<div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
    {Dialog}
    {pendMdl&&<PendExpModal item={pendMdl} pockets={pockets} setPockets={setPockets} setExpenses={setExpenses} setInstallments={setInstallments} onClose={()=>{setPendingItems(p=>p.filter(x=>x.id!==pendMdl.id));setPendMdl(null);}}/>}

    <Card style={{borderColor:"var(--violet)44"}}>
      <SL>📎 อ่าน Slip รายจ่าย (Gemini AI)</SL>
      {showKey&&<GeminiCfg onClose={()=>setShowKey(false)}/>}
      <SlipZone onFile={readSlip} state={slipSt}/>
      <Btn sm col="var(--surface)" style={{color:"var(--sub)",border:"1px solid var(--bd)"}} onClick={()=>setShowKey(p=>!p)}>🔑 Gemini Key</Btn>
    </Card>

    {expPend.length>0&&<Card style={{borderColor:"var(--amber)66",borderWidth:2}}>
      <SL>⏳ รอยืนยัน ({expPend.length})</SL>
      {expPend.map(item=><div key={item.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"0.5px solid var(--bd)"}}>
        <div><div style={{fontSize:13,fontWeight:600,color:"var(--tx)"}}>{item.desc||"(ไม่มีชื่อ)"}</div><div style={{fontSize:11,color:"var(--muted)"}}>{item.date} · {fmtC(item.totalCost||item.amount,item.cur||"THB")}</div></div>
        <div style={{display:"flex",gap:6}}>
          <Btn sm col="var(--amber)" style={{color:"#fff"}} onClick={()=>setPendMdl(item)}>ยืนยัน</Btn>
          <IBtn onClick={()=>setPendingItems(p=>p.filter(x=>x.id!==item.id))} danger>✕</IBtn>
        </div>
      </div>)}
    </Card>}

    <Card>
      <SL>เพิ่มรายจ่าย</SL>
      <div className="fg2" style={{marginBottom:10}}>
        <FW label="หมวดหมู่"><Sel value={f.cat} onChange={e=>setF(p=>({...p,cat:e.target.value}))}>{expCats.map(c=><option key={c}>{c}</option>)}</Sel></FW>
        <FW label="รายละเอียด"><Inp placeholder="เช่น ข้าวกะเพรา" value={f.desc} onChange={e=>setF(p=>({...p,desc:e.target.value}))}/></FW>
        <FW label="จำนวนเงิน"><div style={{display:"flex",gap:6}}><Inp type="number" placeholder="0" value={f.amount} onChange={e=>setF(p=>({...p,amount:e.target.value}))} style={{flex:1}}/><CSel value={f.cur} onChange={v=>setF(p=>({...p,cur:v}))} currencies={currencies}/></div></FW>
        <FW label="เดือน"><Inp type="month" value={f.month} onChange={e=>setF(p=>({...p,month:e.target.value}))}/></FW>
        <FW label="หักจาก Pocket"><Sel value={f.pid} onChange={e=>setF(p=>({...p,pid:e.target.value}))}><option value="">เงินสด / ไม่หัก</option>{pockets.map(p=><option key={p.id} value={p.id}>{p.name} ({fmt(p.amount)})</option>)}</Sel></FW>
        <FW label="ตัวเลือก"><div style={{paddingTop:6}}><label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer",color:"var(--tx)"}}><input type="checkbox" checked={f.isInst} onChange={e=>setF(p=>({...p,isInst:e.target.checked}))}/> ยอดผ่อนชำระ</label></div></FW>
      </div>
      {f.isInst&&<div className="fg2" style={{marginBottom:10,padding:10,background:"var(--surface)",borderRadius:10}}>
        <FW label="ผ่อน/เดือน"><Inp type="number" value={f.monthly} onChange={e=>setF(p=>({...p,monthly:e.target.value}))}/></FW>
        <FW label="จำนวนงวด"><Inp type="number" value={f.totalM} onChange={e=>setF(p=>({...p,totalM:e.target.value}))}/></FW>
        {f.monthly&&f.totalM&&<div style={{gridColumn:"span 2",fontSize:12,color:"var(--amber)"}}>รวม {fmt(parseFloat(f.monthly)*parseInt(f.totalM))} · สิ้นสุด {mLbl(addM(f.month,parseInt(f.totalM)-1))}</div>}
      </div>}
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <Btn col={f.isInst?"var(--amber)":"var(--em)"} style={{color:f.isInst?"#fff":"var(--ink)"}} onClick={add}>+ {f.isInst?"บันทึกยอดผ่อน":"เพิ่มรายจ่าย"}</Btn>
        <Btn col="var(--surface)" style={{color:"var(--sub)",border:"1px solid var(--bd)"}} onClick={()=>setSCM(p=>!p)}>จัดการหมวดหมู่</Btn>
      </div>
      {showCM&&<CatMgr cats={expCats} setCats={setExpCats}/>}
    </Card>

    <Card>
      <SL>Debt Manager</SL>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr><TH>รายการ</TH><TH right>ยอดเต็ม</TH><TH right>ผ่อน/เดือน</TH><TH>คืบหน้า</TH><TH right>เหลือ</TH><TH></TH></tr></thead>
        <tbody>
          {installments.map(inst=>{const[sy,sm]=inst.startMonth.split("-").map(Number);const[cy,cm]=thisMonth().split("-").map(Number);const paid=clamp((cy-sy)*12+(cm-sm)+1,0,inst.totalMonths);const rem=(inst.totalMonths-paid)*inst.monthly;
            return<tr key={inst.id}><TD><div style={{fontWeight:600,color:"var(--tx)"}}>{inst.name}</div><div style={{fontSize:11,color:"var(--muted)"}}>เริ่ม {mLbl(inst.startMonth)}</div></TD><TD right>{fmt(inst.totalAmount)}</TD><TD right style={{color:"var(--amber)",fontWeight:600}}>{fmt(inst.monthly)}</TD>
              <TD style={{minWidth:90}}><div style={{fontSize:11,color:"var(--muted)",marginBottom:2}}>{paid}/{inst.totalMonths}</div><PBar pct={Math.round(paid/inst.totalMonths*100)} col={paid>=inst.totalMonths?"var(--em)":"var(--amber)"}/></TD>
              <TD right style={{color:rem>0?"var(--coral)":"var(--em)"}}>{fmt(rem)}</TD>
              <TD><IBtn onClick={async()=>{const ok=await ask(`ลบยอดผ่อน "${inst.name}"?`);if(ok){setInstallments(p=>p.filter(x=>x.id!==inst.id));toast("ลบแล้ว","ok");}}} danger>🗑</IBtn></TD>
            </tr>;
          })}
          {!installments.length&&<ERow cols={6} msg="ยังไม่มียอดผ่อน"/>}
        </tbody>
      </table></div>
    </Card>

    <Card>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <SL style={{margin:0}}>รายจ่ายประจำเดือน</SL>
        <div style={{display:"flex",gap:5,marginLeft:"auto",alignItems:"center"}}>
          <Inp placeholder="🔍" value={search} onChange={e=>setSearch(e.target.value)} style={{width:100,padding:"5px 8px",fontSize:12}}/>
          <IBtn onClick={()=>setVm(m=>addM(m,-1))}>‹</IBtn>
          <span style={{fontSize:13,fontWeight:600,minWidth:70,textAlign:"center",color:"var(--tx)"}}>{mLbl(vm)}</span>
          <IBtn onClick={()=>setVm(m=>addM(m,1))}>›</IBtn>
        </div>
      </div>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr><TH>ประเภท</TH><TH>รายละเอียด</TH><TH>ชำระผ่าน</TH><TH right>จำนวน</TH><TH></TH></tr></thead>
        <tbody>
          {filteredExp.map(e=><tr key={e.id}><TD><Badge label="จ่าย" color="var(--coral)"/></TD><TD>{e.desc}</TD><TD style={{fontSize:11,color:"var(--muted)"}}>{e.payMethod||"-"}</TD><TD right style={{color:"var(--coral)",fontWeight:600}}>{fmtC(e.amount,e.cur||"THB")}</TD><TD><IBtn onClick={()=>delExp(e)} danger>🗑</IBtn></TD></tr>)}
          {instDue.map(inst=>{const[sy,sm]=inst.startMonth.split("-").map(Number);const[vy,v2]=vm.split("-").map(Number);const paid=(vy-sy)*12+(v2-sm)+1;const isPaid=instPayments.some(p=>p.instId===inst.id&&p.month===vm);
            return<tr key={inst.id}><TD><Badge label="ผ่อน" color="var(--amber)"/></TD><TD>{inst.name} <span style={{fontSize:11,color:"var(--muted)"}}>งวด {paid}/{inst.totalMonths}</span></TD><TD>-</TD>
              <TD right style={{color:"var(--amber)",fontWeight:600}}>{fmt(inst.monthly)}</TD>
              <TD>{isPaid?<Badge label="✓" color="var(--em)"/>:<Btn sm col="var(--amber)" style={{color:"#fff"}} onClick={()=>setPayModal({type:"inst",id:inst.id,month:vm,amount:inst.monthly,name:inst.name,from:""})}>ชำระ</Btn>}</TD>
            </tr>;
          })}
          {ccDue.length>0&&<tr><TD><Badge label="CC ค้าง" color="var(--amber)"/></TD><TD>จาก {mLbl(addM(vm,-1))}</TD><TD>-</TD>
            <TD right style={{color:"var(--amber)",fontWeight:700}}>{fmt(ccTotal)}</TD>
            <TD>{ccPaid?<Badge label="✓" color="var(--em)"/>:<Btn sm col="var(--amber)" style={{color:"#fff"}} onClick={()=>setPayModal({type:"cc",month:vm,amount:ccTotal,name:`CC ${mLbl(addM(vm,-1))}`,from:""})}>ชำระ</Btn>}</TD>
          </tr>}
          {!filteredExp.length&&!instDue.length&&!ccDue.length&&<ERow cols={5}/>}
        </tbody>
      </table></div>
    </Card>

    {payModal&&<Modal title={`ชำระ: ${payModal.name}`} onClose={()=>setPayModal(null)}>
      <div style={{padding:12,background:"var(--surface)",borderRadius:10,marginBottom:14}}><div style={{fontSize:12,color:"var(--muted)",marginBottom:4}}>ยอดที่ต้องชำระ</div><div style={{fontSize:24,fontWeight:800,color:"var(--amber)"}}>{fmt(payModal.amount)}</div></div>
      <FW label="เลือก Pocket ที่จะชำระ"><Sel value={payModal.from||""} onChange={e=>setPayModal(p=>({...p,from:e.target.value}))}><option value="">— เลือก —</option>{pockets.map(p=><option key={p.id} value={p.id}>{p.name} ({fmt(p.amount)})</option>)}</Sel></FW>
      {payModal.from&&(()=>{const pk=pockets.find(p=>p.id===payModal.from);return pk?<div style={{fontSize:12,color:pk.amount>=payModal.amount?"var(--em)":"var(--coral)",marginTop:6}}>ยอดหลังชำระ: {fmt(pk.amount-payModal.amount)}</div>:null;})()}
      <div style={{display:"flex",gap:8,marginTop:14}}><Btn col="var(--em)" style={{color:"var(--ink)"}} onClick={()=>doPay(payModal)}>✓ ยืนยัน</Btn><Btn col="var(--bd)" style={{color:"var(--sub)"}} onClick={()=>setPayModal(null)}>ยกเลิก</Btn></div>
    </Modal>}
  </div>;
}

/* ══════════════════════════════════════
   SAVING TAB
══════════════════════════════════════ */
function SavingTab({pockets,setPockets,transfers,setTransfers,envelopes,setEnvelopes}){
  const toast=useToast();const{ask,Dialog}=useConfirm();
  const[f,setF]=useState({name:"",amount:"",goal:""});
  const[ef,setEf]=useState({name:"",allocated:"",goal:""});
  const[tf,setTf]=useState({from:"",to:"",amount:""});
  const[depMdl,setDepMdl]=useState(null);
  const mainPk=pockets.find(p=>p.isMain)||{id:MAIN_PID,name:"Cash Box",amount:0,isMain:true};
  const others=pockets.filter(p=>!p.isMain);
  const total=pockets.reduce((s,p)=>s+p.amount,0);
  const allocated=envelopes.reduce((s,e)=>s+asNum(e.allocated),0);
  const available=total-allocated;
  const trader=pockets.find(p=>p.id===TRADER_PID||p.name==="TRADER");
  const PC=["var(--em)","var(--violet)","var(--amber)","var(--blue)","var(--coral)","#FF8C42"];

  const addPk=()=>{if(!f.name.trim()){toast("กรุณาตั้งชื่อ","warn");return;}setPockets(p=>[...p,{id:uid(),name:f.name.trim(),amount:parseFloat(f.amount)||0,goal:parseFloat(f.goal)||0,isMain:false}]);toast("✅ สร้าง Pocket","ok");setF({name:"",amount:"",goal:""});};
  const delPk=async id=>{const t=pockets.find(p=>p.id===id);if(!t)return;const ok=await ask(`ลบ "${t.name}" (${fmt(t.amount)}) ยอดคืนสู่ Cash Box`);if(!ok)return;setPockets(p=>p.filter(x=>x.id!==id).map(pk=>pk.isMain?{...pk,amount:pk.amount+t.amount}:pk));toast("ลบแล้ว","ok");};
  const doTf=()=>{const a=parseFloat(tf.amount);if(!tf.from||!tf.to||tf.from===tf.to||!a||a<=0){toast("กรุณากรอกครบ","warn");return;}const fp=pockets.find(p=>p.id===tf.from);if(!fp||fp.amount<a){toast("เงินไม่พอ","error");return;}const tp=pockets.find(p=>p.id===tf.to);setPockets(p=>p.map(pk=>pk.id===tf.from?{...pk,amount:Math.max(0,pk.amount-a)}:pk.id===tf.to?{...pk,amount:pk.amount+a}:pk));setTransfers(p=>[...p,{id:uid(),from:fp.name,to:tp.name,amount:a,date:today()}]);toast(`✅ โยก ${fmt(a)} → ${tp.name}`,"ok");setTf(p=>({...p,amount:""}));};
  const doDeposit=()=>{const a=parseFloat(depMdl.amount||0);if(!a||a<=0){toast("กรุณากรอกจำนวน","warn");return;}setPockets(p=>p.map(pk=>pk.id===depMdl.id?{...pk,amount:pk.amount+a}:pk));toast(`✅ เพิ่ม ${fmt(a)}`,"ok");setDepMdl(null);};
  const addEnvelope=()=>{const a=asNum(ef.allocated);if(!ef.name.trim()){toast("ตั้งชื่อ CloudPocket ก่อน","warn");return;}if(a>available+1e-9){toast("ยอดจัดสรรเกินเงินรวมในบัญชี","error");return;}setEnvelopes(p=>[...p,stamp({id:uid(),name:ef.name.trim(),allocated:a,goal:asNum(ef.goal)})]);setEf({name:"",allocated:"",goal:""});toast("สร้าง CloudPocket แล้ว","ok");};

  return<div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
    {Dialog}
    {depMdl&&<Modal title={`เพิ่มเงินใน ${depMdl.name}`} onClose={()=>setDepMdl(null)}>
      <FW label="จำนวนเงิน (บาท)"><Inp type="number" placeholder="0" value={depMdl.amount||""} onChange={e=>setDepMdl(d=>({...d,amount:e.target.value}))} autoFocus/></FW>
      <div style={{display:"flex",gap:8,marginTop:14}}><Btn col="var(--em)" style={{color:"var(--ink)"}} onClick={doDeposit}>✓ เพิ่มเงิน</Btn><Btn col="var(--bd)" style={{color:"var(--sub)"}} onClick={()=>setDepMdl(null)}>ยกเลิก</Btn></div>
    </Modal>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8}}>
      <div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"1rem"}}><SL>รวมทั้งหมด</SL><div style={{fontSize:22,fontWeight:700,color:"var(--violet)"}}>{fmt(total)}</div></div>
      <div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"1rem"}}><SL>Cash Box</SL><div style={{fontSize:22,fontWeight:700,color:"var(--em)"}}>{fmt(mainPk.amount)}</div></div>
      <div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"1rem"}}><SL>ใช้ได้จริง</SL><div style={{fontSize:22,fontWeight:700,color:available>=0?"var(--blue)":"var(--coral)"}}>{fmt(available)}</div></div>
      {trader&&<div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"1rem"}}><SL>💹 TRADER</SL><div style={{fontSize:22,fontWeight:700,color:"var(--blue)"}}>{fmtC(trader.amount,"USD")}</div></div>}
    </div>
    <Card style={{borderColor:"var(--violet)55"}}>
      <SL>☁ CloudPocket — งบที่จัดสรรแล้ว (ไม่ใช่บัญชีเงินจริง)</SL>
      <div style={{fontSize:11,color:"var(--muted)",marginBottom:10}}>บัญชีเงินจริงรวม {fmt(total)} · กันไว้แล้ว {fmt(allocated)} · เงินที่ยังไม่จัดสรร {fmt(available)}</div>
      <div className="fg3" style={{marginBottom:8}}><FW label="ชื่อ Pocket"><Inp placeholder="ฉุกเฉิน / ท่องเที่ยว" value={ef.name} onChange={e=>setEf(p=>({...p,name:e.target.value}))}/></FW><FW label="จัดสรร"><Inp type="number" value={ef.allocated} onChange={e=>setEf(p=>({...p,allocated:e.target.value}))}/></FW><FW label="เป้าหมาย"><Inp type="number" value={ef.goal} onChange={e=>setEf(p=>({...p,goal:e.target.value}))}/></FW></div>
      <Btn sm col="var(--violet)" onClick={addEnvelope}>+ สร้าง CloudPocket</Btn>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:8,marginTop:12}}>{envelopes.map((e,i)=>{const pct=e.goal?clamp(asNum(e.allocated)/e.goal*100,0,100):0;return<Card key={e.id} style={{padding:10}}><div style={{display:"flex",justifyContent:"space-between",gap:4}}><span style={{fontWeight:700,fontSize:12,color:"var(--violet)"}}>{e.name}</span><IBtn danger onClick={()=>setEnvelopes(p=>p.filter(x=>x.id!==e.id))}>✕</IBtn></div><div style={{fontWeight:700,color:"var(--tx)",margin:"5px 0"}}>{fmt(e.allocated)}</div>{e.goal>0&&<><div style={{fontSize:10,color:"var(--muted)",marginBottom:3}}>เป้า {fmt(e.goal)} · {Math.round(pct)}%</div><PBar pct={pct} col="var(--violet)" h={4}/></>}</Card>;})}</div>
    </Card>
    <Card style={{borderColor:"var(--em)55",borderWidth:2}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><span style={{fontSize:14,fontWeight:700,color:"var(--em)"}}>☁ {mainPk.name}</span><Badge label="หลัก" color="var(--em)"/></div><div style={{fontSize:11,color:"var(--muted)"}}>รายรับเข้าที่นี่อัตโนมัติ</div></div>
        <div style={{fontSize:22,fontWeight:800,color:"var(--em)"}}>{fmt(mainPk.amount)}</div>
      </div>
      <div style={{marginTop:10}}><Btn sm col="var(--em)" style={{color:"var(--ink)"}} onClick={()=>setDepMdl({id:mainPk.id,name:mainPk.name,amount:""})}>+ เพิ่มเงิน</Btn></div>
    </Card>
    <Card>
      <SL>บัญชีเงินจริง</SL>
      <div style={{fontSize:11,color:"var(--muted)",marginBottom:8}}>💡 สร้าง Pocket ชื่อ <strong style={{color:"var(--blue)"}}>TRADER</strong> เพื่อรับเงินจากขายสินทรัพย์อัตโนมัติ</div>
      <div className="fg3" style={{marginBottom:10}}>
        <FW label="ชื่อ"><Inp placeholder="TRADER / เกษียณ" value={f.name} onChange={e=>setF(p=>({...p,name:e.target.value}))}/></FW>
        <FW label="ยอดเริ่มต้น"><Inp type="number" placeholder="0" value={f.amount} onChange={e=>setF(p=>({...p,amount:e.target.value}))}/></FW>
        <FW label="เป้าหมาย"><Inp type="number" placeholder="0" value={f.goal} onChange={e=>setF(p=>({...p,goal:e.target.value}))}/></FW>
      </div>
      <Btn sm col="var(--violet)" onClick={addPk}>+ สร้างบัญชี</Btn>
    </Card>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(175px,1fr))",gap:10}}>
      {others.map((pk,i)=>{const isT=pk.id===TRADER_PID||pk.name==="TRADER";const col=isT?"var(--blue)":PC[i%PC.length];const pct=pk.goal>0?clamp(Math.round(pk.amount/pk.goal*100),0,100):null;
        return<Card key={pk.id} style={{borderColor:col+"44"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}><span style={{fontSize:13,fontWeight:700,color:col}}>{isT?"💹 ":""}{pk.name}</span><IBtn onClick={()=>delPk(pk.id)} danger>✕</IBtn></div>
          <div style={{fontSize:20,fontWeight:700,color:col,marginBottom:4}}>{isT?fmtC(pk.amount,"USD"):fmt(pk.amount)}</div>
          {isT&&<div style={{fontSize:10,color:"var(--muted)",marginBottom:6}}>รับเงินจากการขายสินทรัพย์</div>}
          {pct!==null&&<><div style={{fontSize:11,color:"var(--muted)",marginBottom:3}}>เป้า {fmt(pk.goal)} · {pct}%</div><PBar pct={pct} col={col}/></>}
          <div style={{marginTop:8}}><Btn sm col={col} style={{color:"#fff",width:"100%"}} onClick={()=>setDepMdl({id:pk.id,name:pk.name,amount:""})}>+ เพิ่มเงิน</Btn></div>
        </Card>;
      })}
    </div>
    <Card>
      <SL>โยกย้ายเงิน</SL>
      <div className="fg2" style={{marginBottom:8}}>
        <FW label="จาก"><Sel value={tf.from} onChange={e=>setTf(p=>({...p,from:e.target.value}))}><option value="">เลือก</option>{pockets.map(p=><option key={p.id} value={p.id}>{p.name} ({fmt(p.amount)})</option>)}</Sel></FW>
        <FW label="ไปยัง"><Sel value={tf.to} onChange={e=>setTf(p=>({...p,to:e.target.value}))}><option value="">เลือก</option>{pockets.filter(p=>p.id!==tf.from).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</Sel></FW>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
        <div style={{flex:1}}><FW label="จำนวน"><Inp type="number" placeholder="0" value={tf.amount} onChange={e=>setTf(p=>({...p,amount:e.target.value}))}/></FW></div>
        <Btn col="var(--violet)" onClick={doTf}>โยกเงิน</Btn>
      </div>
    </Card>
    {transfers.length>0&&<Card><SL>ประวัติโยกย้าย</SL>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr><TH>วันที่</TH><TH>จาก</TH><TH>ไปยัง</TH><TH right>จำนวน</TH></tr></thead>
        <tbody>{[...transfers].reverse().slice(0,10).map(t=><tr key={t.id}><TD style={{fontSize:11,color:"var(--muted)"}}>{t.date}</TD><TD>{t.from}</TD><TD>{t.to}</TD><TD right style={{color:"var(--violet)",fontWeight:600}}>{fmt(t.amount)}</TD></tr>)}</tbody>
      </table></div>
    </Card>}
  </div>;
}

/* ══════════════════════════════════════
   INVEST TAB
══════════════════════════════════════ */
function InvestTab({investments,setInvestments,invCurrencies,setInvCurrencies,pockets,setPockets,pendingItems,setPendingItems}){
  const toast=useToast();const{ask,Dialog}=useConfirm();
  const defCur=invCurrencies[0]||"USD";
  const[buyF,setBF]=useState({action:"buy",type:"หุ้น",name:"",date:today(),qty:"",price:"",fee:"",totalCost:"",cur:defCur});
  const[slipSt,setSlipSt]=useState(null);
  const[showKey,setShowKey]=useState(false);
  const[pendMdl,setPendMdl]=useState(null);
  const[ft,setFT]=useState("ทั้งหมด");const[fa,setFA]=useState("ทั้งหมด");
  const[newCur,setNC]=useState("");
  const[savedNames,setSavedNames]=useLS("kpxf_inv_names",[]);
  const[showDd,setShowDd]=useState(false);
  const trader=pockets.find(p=>p.id===TRADER_PID||p.name==="TRADER");

  const calc=(f,field,val)=>{const n={...f,[field]:val};const pr=parseFloat(n.price)||0,fe=parseFloat(n.fee)||0,q=parseFloat(n.qty)||0,tot=parseFloat(n.totalCost)||0;if((field==="totalCost"||field==="price"||field==="fee")&&tot>0&&pr>0)n.qty=String(fmtN((tot-(n.action==="sell"?-fe:fe))/pr,6));if((field==="qty"||field==="price"||field==="fee")&&q>0&&pr>0)n.totalCost=String(fmtN(n.action==="sell"?q*pr-fe:q*pr+fe,2));return n;};
  const ledger=useMemo(()=>investmentLedger(investments),[investments]);
  const portfolio=ledger.positions;
  const getAvg=useCallback(key=>ledger.positions.find(p=>p.key===key)?.avgCost||0,[ledger]);
  const totCost=portfolio.reduce((s,p)=>s+p.cost,0);
  const totPnl=ledger.realizedPnl;

  const addTrade=()=>{
    if(!buyF.name||!buyF.qty||!buyF.price){toast("กรุณากรอก ชื่อ/จำนวน/ราคา","warn");return;}
    const q=parseFloat(buyF.qty),pr=parseFloat(buyF.price),fe=parseFloat(buyF.fee)||0;
    const nm=buyF.name.trim();
    if(buyF.action==="sell"){const held=portfolio.find(p=>p.key===nm.toUpperCase())?.qty||0;if(q>held+1e-9){toast(`ขายได้สูงสุด ${fmtN(held,6)} หน่วย`,`error`);return;}}
    const gross=q*pr,net=buyF.action==="sell"?gross-fe:gross+fe;
    setInvestments(p=>[...p,stamp({id:uid(),action:buyF.action,type:buyF.type,name:nm,key:nm.toUpperCase(),date:buyF.date,qty:q,price:pr,gross,fee:fe,totalCost:net,netProceeds:buyF.action==="sell"?net:undefined,cur:buyF.cur})]);
    if(nm&&!savedNames.includes(nm))setSavedNames(p=>[...p,nm]);
    toast(`✅ บันทึกการ${buyF.action==="sell"?"ขาย":"ซื้อ"}`,"ok");setBF(p=>({...p,name:"",qty:"",price:"",fee:"",totalCost:""}));
  };

  const[slipErr,setSlipErr]=useState("");
  const readSlip=async file=>{
    if(!localStorage.getItem(GEMINI_KEY)&&!localStorage.getItem(SCAN_ENDPOINT)){setSlipSt("nokey");setShowKey(true);return;}
    setSlipSt("loading");setSlipErr("");
    try{
      const prompt="Analyze this investment/stock trading slip image. Return ONLY valid JSON, no markdown. Format: {\"action\":\"buy or sell\",\"type\":\"stock/gold/fund/crypto/other\",\"name\":\"asset ticker or name\",\"date\":\"YYYY-MM-DD\",\"qty\":quantity_number,\"price\":price_per_unit_number,\"fee\":total_fee_number,\"totalCost\":total_cost_number,\"cur\":\"USD or THB or EUR\"}";
      const raw=await readSlipGemini(file,prompt);
      let d;
      try{d=JSON.parse(raw);}catch{throw new Error("Gemini ตอบไม่ใช่ JSON: "+raw.slice(0,80));}
      const p={id:uid(),source:"invest",action:d.action||"buy",type:d.type||"หุ้น",name:d.name||"",date:d.date||today(),qty:parseFloat(d.qty)||0,price:parseFloat(d.price)||0,fee:parseFloat(d.fee)||0,totalCost:parseFloat(d.totalCost)||0,cur:d.cur||"USD",createdAt:nowIso()};
      setPendingItems(p2=>[...p2,p]);setSlipSt("ok");setPendMdl(p);
    }catch(err){
      setSlipSt(err.message==="NO_KEY"?"nokey":"error");
      setSlipErr(err.message||"");
      if(err.message==="NO_KEY")setShowKey(true);
    }
  };

  const delTrade=async id=>{const ok=await ask("ลบรายการนี้?");if(ok){setInvestments(p=>p.filter(x=>x.id!==id));toast("ลบแล้ว","ok");}};
  const invPend=pendingItems.filter(x=>x.source==="invest");
  const types=["ทั้งหมด",...[...new Set(investments.map(t=>t.type))]];
  const names=useMemo(()=>["ทั้งหมด",...[...new Set((ft==="ทั้งหมด"?investments:investments.filter(t=>t.type===ft)).map(t=>t.name))]]  ,[investments,ft]);
  useEffect(()=>setFA("ทั้งหมด"),[ft]);
  const filtered=useMemo(()=>investments.filter(t=>(ft==="ทั้งหมด"||t.type===ft)&&(fa==="ทั้งหมด"||t.name===fa)),[investments,ft,fa]);
  const TC={ทองคำ:"var(--amber)",หุ้น:"var(--blue)",กองทุน:"var(--violet)",คริปโต:"var(--em)",อื่นๆ:"var(--muted)"};

  return<div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
    {Dialog}
    {pendMdl&&<PendInvModal item={pendMdl} pockets={pockets} setPockets={setPockets} investments={investments} setInvestments={setInvestments} savedNames={savedNames} setSavedNames={setSavedNames} onClose={()=>{setPendingItems(p=>p.filter(x=>x.id!==pendMdl.id));setPendMdl(null);}}/>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8}}>
      <div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"1rem"}}><SL>พอร์ต</SL><div style={{fontSize:22,fontWeight:700,color:"var(--blue)"}}>{portfolio.length} รายการ</div></div>
      <div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"1rem"}}><SL>ต้นทุนรวม</SL><div style={{fontSize:22,fontWeight:700,color:"var(--amber)"}}>{fmtN(totCost,2)}</div></div>
      <div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"1rem"}}><SL>P&L รวม</SL><div style={{fontSize:22,fontWeight:700,color:totPnl>=0?"var(--em)":"var(--coral)"}}>{totPnl>=0?"+":""}{fmtN(totPnl,2)}</div></div>
      {trader&&<div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"1rem"}}><SL>💹 TRADER</SL><div style={{fontSize:22,fontWeight:700,color:"var(--blue)"}}>{fmtC(trader.amount,"USD")}</div></div>}
    </div>
    {ledger.issues.length>0&&<div style={{background:"var(--coral)18",border:"1px solid var(--coral)66",borderRadius:12,padding:"10px 12px",fontSize:12,color:"var(--coral)"}}>⚠ ตรวจพบรายการลงทุนผิดปกติ: {ledger.issues.map(x=>x.message).join(" · ")}</div>}
    <Card style={{borderColor:"var(--blue)44"}}>
      <SL>📎 อ่าน Slip การลงทุน (Gemini AI)</SL>
      {showKey&&<GeminiCfg onClose={()=>setShowKey(false)}/>}
      <SlipZone onFile={readSlip} state={slipSt}/>
      {slipErr&&slipSt==="error"&&<div style={{background:"var(--coral)18",border:"0.5px solid var(--coral)50",borderRadius:10,padding:"8px 12px",marginBottom:8,fontSize:11,color:"var(--coral)"}}>{slipErr}</div>}
      <Btn sm col="var(--surface)" style={{color:"var(--sub)",border:"1px solid var(--bd)"}} onClick={()=>setShowKey(p=>!p)}>🔑 Gemini Key</Btn>
    </Card>
    {invPend.length>0&&<Card style={{borderColor:"var(--amber)66",borderWidth:2}}>
      <SL>⏳ รอยืนยัน ({invPend.length})</SL>
      {invPend.map(item=><div key={item.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"0.5px solid var(--bd)"}}>
        <div><div style={{display:"flex",alignItems:"center",gap:6}}><Badge label={item.action==="buy"?"ซื้อ":"ขาย"} color={item.action==="buy"?"var(--em)":"var(--coral)"}/><span style={{fontSize:13,fontWeight:600,color:"var(--tx)"}}>{item.name}</span></div><div style={{fontSize:11,color:"var(--muted)"}}>{item.date} · {fmtC(item.totalCost,item.cur||"USD")}</div>{item.action==="sell"&&<div style={{fontSize:11,color:"var(--blue)"}}>💰 เงินเข้า TRADER</div>}</div>
        <div style={{display:"flex",gap:6}}><Btn sm col={item.action==="buy"?"var(--em)":"var(--coral)"} style={{color:item.action==="buy"?"var(--ink)":"#fff"}} onClick={()=>setPendMdl(item)}>ยืนยัน</Btn><IBtn onClick={()=>setPendingItems(p=>p.filter(x=>x.id!==item.id))} danger>✕</IBtn></div>
      </div>)}
    </Card>}
    <Card>
      <SL>บันทึกการซื้อ / ขาย</SL>
      <div style={{display:"flex",gap:6,marginBottom:10}}><Btn sm col={buyF.action==="buy"?"var(--em)":"var(--bd)"} style={{color:buyF.action==="buy"?"var(--ink)":"var(--sub)"}} onClick={()=>setBF(p=>({...p,action:"buy",totalCost:""}))}>ซื้อ</Btn><Btn sm col={buyF.action==="sell"?"var(--coral)":"var(--bd)"} style={{color:buyF.action==="sell"?"#fff":"var(--sub)"}} onClick={()=>setBF(p=>({...p,action:"sell",totalCost:""}))}>ขาย</Btn></div>
      <div className="fg2" style={{marginBottom:10}}>
        <FW label="ประเภท"><Sel value={buyF.type} onChange={e=>setBF(p=>({...p,type:e.target.value,name:e.target.value==="ทองคำ"?"GOLD":p.name}))}>{["ทองคำ","หุ้น","กองทุน","คริปโต","อื่นๆ"].map(t=><option key={t}>{t}</option>)}</Sel></FW>
        <FW label="ชื่อสินทรัพย์"><div style={{position:"relative"}}>

          {showDd&&savedNames.filter(n=>n.toLowerCase().includes(buyF.name.toLowerCase())&&n!==buyF.name).length>0&&<div style={{position:"absolute",top:"100%",left:0,right:0,background:"var(--card)",border:"1px solid var(--bd)",borderRadius:10,zIndex:100,maxHeight:150,overflowY:"auto",boxShadow:"0 4px 16px var(--shadow)"}}>

    <Card style={{padding:"10px 14px"}}>

}
