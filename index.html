// GEMINI SLIP READER (Telegram Bot bridge)
// ══════════════════════════════════════════
function GeminiSlipReader({pendingAdd}){
  const[geminiKey,setGeminiKey]=React.useState(()=>localStorage.getItem("fcc6_gemini_key")||"");
  const[botToken,setBotToken]=React.useState(()=>localStorage.getItem("fcc6_bot_token")||"");
  const[showSetup,setShowSetup]=React.useState(false);
  const[slip,setSlip]=React.useState(null); // null | loading | ok | error
  const[polling,setPolling]=React.useState(false);
  const[lastUpdateId,setLastUpdateId]=React.useState(()=>parseInt(localStorage.getItem("fcc6_last_update")||"0"));
  const pollRef=React.useRef(null);

  const saveKeys=()=>{
    localStorage.setItem("fcc6_gemini_key",geminiKey);
    localStorage.setItem("fcc6_bot_token",botToken);
    setShowSetup(false);
  };

  const analyzeWithGemini=async(b64,mimeType)=>{
    setSlip("loading");
    const key=localStorage.getItem("fcc6_gemini_key");
    if(!key){alert("กรุณาใส่ Gemini API Key ก่อน");setShowSetup(true);setSlip(null);return;}
    try{
      const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[
          {text:'วิเคราะห์ slip การซื้อขาย/ค่าใช้จ่าย ตอบ JSON เท่านั้น ไม่มี markdown: {"name":"รายละเอียด","amount":จำนวนเงิน,"date":"YYYY-MM-DD","type":"ค่าใช้จ่าย/การลงทุน","category":"หมวดหมู่"} หากไม่ใช่ slip ให้ตอบ {"error":"not a slip"}'},
          {inline_data:{mime_type:mimeType,data:b64}}
        ]}]})
      });
      const data=await resp.json();
      const text=data.candidates?.[0]?.content?.parts?.[0]?.text||"{}";
      const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());
      if(parsed.error){alert("ไม่ใช่ slip: "+parsed.error);setSlip("error");return;}
      pendingAdd(parsed);
      setSlip("ok");
      setTimeout(()=>setSlip(null),3000);
    }catch(e){console.error(e);setSlip("error");setTimeout(()=>setSlip(null),3000);}
  };

  const readFile=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{const b64=ev.target.result.split(",")[1];analyzeWithGemini(b64,file.type);};
    r.readAsDataURL(file);e.target.value="";
  };

  const startPolling=()=>{
    const token=localStorage.getItem("fcc6_bot_token");
    if(!token){alert("กรุณาใส่ Telegram Bot Token ก่อน");setShowSetup(true);return;}
    setPolling(true);
    const poll=async()=>{
      try{
        const resp=await fetch(`https://api.telegram.org/bot${token}/getUpdates?offset=${lastUpdateId+1}&timeout=5&allowed_updates=["message"]`);
        const data=await resp.json();
        if(!data.ok)return;
        for(const upd of data.result){
          setLastUpdateId(upd.update_id);
          localStorage.setItem("fcc6_last_update",String(upd.update_id));
          const photo=upd.message?.photo;
          if(photo){
            const largest=photo[photo.length-1];
            const fileResp=await fetch(`https://api.telegram.org/bot${token}/getFile?file_id=${largest.file_id}`);
            const fileData=await fileResp.json();
            const fileUrl=`https://api.telegram.org/file/bot${token}/${fileData.result.file_path}`;
            const imgResp=await fetch(fileUrl);
            const blob=await imgResp.blob();
            const r=new FileReader();
            r.onload=ev=>{const b64=ev.target.result.split(",")[1];analyzeWithGemini(b64,blob.type||"image/jpeg");};
            r.readAsDataURL(blob);
            await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:upd.message.chat.id,text:"✅ รับ slip แล้ว! กำลังวิเคราะห์ด้วย Gemini AI..."})});
          }
        }
      }catch(e){console.error("Polling error",e);}
    };
    pollRef.current=setInterval(poll,6000);
  };

  const stopPolling=()=>{clearInterval(pollRef.current);setPolling(false);};
  React.useEffect(()=>()=>clearInterval(pollRef.current),[]);

  return<div>
    <div style={{background:C.card,border:`0.5px solid ${C.border}`,borderRadius:16,padding:"1rem",marginBottom:"1rem"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:700,color:C.text}}>📎 อ่าน Slip ด้วย Gemini AI</div>
        <Btn sm color={C.border} style={{color:C.subtext}} onClick={()=>setShowSetup(p=>!p)}>⚙ ตั้งค่า</Btn>
      </div>

      {showSetup&&<div style={{background:C.surface,borderRadius:10,padding:"12px",marginBottom:12}}>
        <div style={{fontSize:11,color:C.muted,marginBottom:4}}>🔑 Gemini API Key (จาก aistudio.google.com ฟรี)</div>
        <Inp type="password" placeholder="AIza..." value={geminiKey} onChange={e=>setGeminiKey(e.target.value)} style={{marginBottom:8}}/>
        <div style={{fontSize:11,color:C.muted,marginBottom:4}}>🤖 Telegram Bot Token (จาก @BotFather)</div>
        <Inp type="password" placeholder="123456:ABC..." value={botToken} onChange={e=>setBotToken(e.target.value)} style={{marginBottom:8}}/>
        <Btn sm onClick={saveKeys} color={C.em}>บันทึก</Btn>
        <div style={{fontSize:10,color:C.muted,marginTop:8,lineHeight:1.6}}>
          วิธีรับ Gemini Key: ไปที่ aistudio.google.com → Get API Key → Create API Key (ฟรี)<br/>
          วิธีสร้าง Bot: พิมพ์ /newbot ใน @BotFather บน Telegram → ตั้งชื่อ → รับ Token
        </div>
      </div>}

      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <label style={{cursor:"pointer"}}>
          <Btn sm color={slip==="loading"?"#B0C0CC":C.blue} style={{color:"#fff"}} disabled={slip==="loading"}>
            {slip==="loading"?"⏳ กำลังวิเคราะห์...":slip==="ok"?"✅ อ่านสำเร็จ!":slip==="error"?"❌ ลองใหม่":"📷 อัพโหลด Slip"}
          </Btn>
          <input type="file" accept="image/*" style={{display:"none"}} onChange={readFile} disabled={slip==="loading"}/>
        </label>
        <Btn sm color={polling?C.coral:C.em} style={{color:polling?"#fff":C.ink}} onClick={polling?stopPolling:startPolling}>
          {polling?"⏹ หยุด Telegram":"📱 รับจาก Telegram"}
        </Btn>
        {polling&&<span style={{fontSize:11,color:C.em,animation:"pulse 1.5s infinite"}}>● กำลังรับข้อมูล...</span>}
      </div>
    </div>
  </div>;
}

  const[expCats,setExpCats]=useLS("fcc5_expcats",DEF_EXP_CATS);
  const[transfers,setTransfers]=useLS("fcc5_tf",[]);
  const[invCurrencies,setInvCurrencies]=useLS("fcc5_invcur",["USD","THB","EUR"]);
  const[tab,setTab]=useState(0);
  const[syncState,setSyncState]=useState("idle");
  const currencies=["THB","USD","EUR","JPY","GBP","SGD"];
  const pending=usePending();

  useEffect(()=>{if(!pockets.find(p=>p.isMain))setPockets(p=>[{id:MAIN_PID,name:"Cash Box",amount:0,goal:0,isMain:true},...p]);},[]);

  const state={incomes,expenses,installments,instPayments,ccDebts,ccPayments,pockets,investments,incCats,expCats,transfers,invCurrencies};
  const setAll=d=>{
    if(d.incomes)setIncomes(d.incomes);if(d.expenses)setExpenses(d.expenses);
    if(d.installments)setInstallments(d.installments);if(d.instPayments)setInstPayments(d.instPayments);
    if(d.ccDebts)setCcDebts(d.ccDebts);if(d.ccPayments)setCcPayments(d.ccPayments);
    if(d.pockets)setPockets(d.pockets);if(d.investments)setInvestments(d.investments);
    if(d.incCats)setIncCats(d.incCats);if(d.expCats)setExpCats(d.expCats);
    if(d.transfers)setTransfers(d.transfers);if(d.invCurrencies)setInvCurrencies(d.invCurrencies);
  };

  return<PINGate><div style={{background:C.ink,minHeight:"100vh",padding:"1rem",maxWidth:1200,margin:"0 auto"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1rem",flexWrap:"wrap",gap:8}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:22,fontWeight:700,color:C.text,letterSpacing:"-0.5px"}}>KPx<span style={{color:C.em}}>Finance</span></span>
        <span style={{fontSize:10,color:C.muted,background:C.card,padding:"2px 8px",borderRadius:99,border:`0.5px solid ${C.border}`}}>v6.0</span>
        <SyncStatus syncState={syncState}/>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <SheetsSync state={state} setAll={setAll} setSyncState={setSyncState}/>
      </div>
    </div>
    <PendingSlipPanel pending={pending} pockets={pockets} setPockets={setPockets} setExpenses={setExpenses} setInstallments={setInstallments} setInvestments={setInvestments} expenses={expenses} installments={installments}/>
    <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:"1.25rem"}}>{TABS.map((t,i)=><Pill key={t} active={tab===i} onClick={()=>setTab(i)}>{t}</Pill>)}</div>
    {tab===0&&<Overview incomes={incomes} expenses={expenses} installments={installments} instPayments={instPayments} ccDebts={ccDebts} ccPayments={ccPayments} pockets={pockets} investments={investments}/>}
    {tab===1&&<SummaryTab incomes={incomes} expenses={expenses} installments={installments}/>}
    {tab===2&&<IncomeTab incomes={incomes} setIncomes={setIncomes} cats={incCats} setCats={setIncCats} pockets={pockets} setPockets={setPockets} currencies={currencies}/>}
    {tab===3&&<ExpenseTab expenses={expenses} setExpenses={setExpenses} expCats={expCats} setExpCats={setExpCats} installments={installments} setInstallments={setInstallments} instPayments={instPayments} setInstPayments={setInstPayments} ccDebts={ccDebts} setCcDebts={setCcDebts} ccPayments={ccPayments} setCcPayments={setCcPayments} pockets={pockets} setPockets={setPockets} currencies={currencies} pendingAdd={pending.add}/>}
    {tab===4&&<SavingTab pockets={pockets} setPockets={setPockets} transfers={transfers} setTransfers={setTransfers}/>}
    {tab===5&&<InvestTab investments={investments} setInvestments={setInvestments} invCurrencies={invCurrencies} setInvCurrencies={setInvCurrencies} pockets={pockets} setPockets={setPockets} pendingAdd={pending.add}/>}
  </div></PINGate>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
