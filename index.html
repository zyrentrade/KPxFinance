<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KPxFinance · v6 · Sheets+Gemini</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E8EFF5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0E2A38}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:#E0EBF2}::-webkit-scrollbar-thumb{background:#B0CCE0;border-radius:3px}
select option{background:#F4F9FC;color:#0E2A38}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
.modal-overlay{position:fixed;inset:0;background:rgba(14,42,56,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:#fff;border:0.5px solid #D0DDE8;border-radius:20px;padding:1.5rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useCallback}=React;
const C={ink:"#E8EFF5",surface:"#F4F9FC",card:"#FFFFFF",border:"#D0DDE8",em:"#1DB870",amber:"#E8A020",coral:"#C04030",violet:"#5070C0",muted:"#90AABC",text:"#0E2A38",subtext:"#3A6070",blue:"#1860A0"};
const uid=()=>Date.now()+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().split("T")[0];
const thisMonth=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};
const nextMonth=(mk)=>addMonths(mk,1);
const monthLabel=mk=>{if(!mk)return"";const[y,m]=mk.split("-");return new Date(y,m-1,1).toLocaleDateString("th-TH",{month:"short",year:"2-digit"});};
const addMonths=(mk,n)=>{const[y,m]=mk.split("-").map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const fmtN=(n,d=2)=>parseFloat(n||0).toFixed(d);
const FMT_SYM={THB:"฿",USD:"$",EUR:"€",JPY:"¥",GBP:"£",SGD:"S$"};
const fmtC=(n,cur="THB")=>(FMT_SYM[cur]||cur+" ")+Math.abs(n||0).toLocaleString("en-US",{minimumFractionDigits:cur==="THB"?0:2,maximumFractionDigits:4});
const fmt=n=>"฿"+Math.round(n||0).toLocaleString("th-TH");
const MAIN_PID="__main__";

function useLS(key,init){
  const[val,setVal]=useState(()=>{try{const s=localStorage.getItem(key);return s?JSON.parse(s):init;}catch{return init;}});
  const set=useCallback(v=>{setVal(p=>{const next=typeof v==="function"?v(p):v;localStorage.setItem(key,JSON.stringify(next));return next;});},[key]);
  return[val,set];
}

// ── Atoms ──
const Badge=({label,color=C.em,style={}})=><span style={{background:color+"22",color,border:`1px solid ${color}44`,borderRadius:99,padding:"2px 8px",fontSize:11,fontWeight:600,whiteSpace:"nowrap",...style}}>{label}</span>;
const Pill=({children,active,onClick})=><button onClick={onClick} style={{background:active?C.em:"transparent",color:active?C.ink:C.muted,border:`1px solid ${active?C.em:C.border}`,borderRadius:99,padding:"6px 14px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{children}</button>;
const Card=({children,style={}})=><div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:"1.25rem",...style}}>{children}</div>;
const SL=({children,style={}})=><div style={{fontSize:11,fontWeight:600,color:C.muted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8,...style}}>{children}</div>;
const Inp=({style={},...p})=><input {...p} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",color:C.text,fontSize:13,width:"100%",outline:"none",...style}}/>;
const Sel=({children,style={},...p})=><select {...p} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",color:C.text,fontSize:13,width:"100%",outline:"none",...style}}>{children}</select>;
const Btn=({children,color=C.em,onClick,style={},disabled=false,sm=false})=><button onClick={onClick} disabled={disabled} style={{background:disabled?C.border:color,color:disabled?C.muted:(color===C.em||color===C.amber?C.ink:"#fff"),border:"none",borderRadius:8,padding:sm?"5px 12px":"8px 16px",fontSize:sm?12:13,fontWeight:700,cursor:disabled?"default":"pointer",whiteSpace:"nowrap",...style}}>{children}</button>;
const IBtn=({children,onClick,title})=><button onClick={onClick} title={title} style={{background:"none",border:"none",cursor:"pointer",color:C.muted,padding:"2px 5px",borderRadius:4,fontSize:14}} onMouseEnter={e=>e.currentTarget.style.color=C.coral} onMouseLeave={e=>e.currentTarget.style.color=C.muted}>{children}</button>;
const PBar=({pct,color=C.em,h=6})=><div style={{background:C.border,borderRadius:4,height:h,overflow:"hidden"}}><div style={{width:`${clamp(pct,0,100)}%`,height:h,background:color,borderRadius:4,transition:"width .4s"}}/></div>;
const MCard=({label,value,color=C.text,sub})=><Card style={{background:"#fff"}}><SL>{label}</SL><div style={{fontSize:20,fontWeight:700,color}}>{value}</div>{sub&&<div style={{fontSize:12,color:C.muted,marginTop:3}}>{sub}</div>}</Card>;
const TH=({children,right})=><th style={{textAlign:right?"right":"left",padding:"7px 8px",fontSize:11,fontWeight:600,color:C.muted,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>{children}</th>;
const TD=({children,right,style={}})=><td style={{textAlign:right?"right":"left",padding:"7px 8px",fontSize:12,color:C.text,borderBottom:`1px solid ${C.border}`,verticalAlign:"middle",...style}}>{children}</td>;
const ERow=({cols,msg="ยังไม่มีข้อมูล"})=><tr><td colSpan={cols} style={{textAlign:"center",padding:"1.5rem",color:C.muted,fontSize:13}}>{msg}</td></tr>;
const CurSel=({value,onChange,currencies,style={}})=><Sel value={value} onChange={e=>onChange(e.target.value)} style={{width:80,padding:"6px 6px",fontSize:12,...style}}>{currencies.map(c=><option key={c}>{c}</option>)}</Sel>;

// ── Modal ──
function Modal({title,onClose,children}){
  return<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal-box">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span style={{fontWeight:700,fontSize:16}}>{title}</span>
        <IBtn onClick={onClose} title="ปิด">✕</IBtn>
      </div>
      {children}
    </div>
  </div>;
}

// ── CatManager ──
function CatManager({cats,setCats}){
  const[nv,setNv]=useState("");
  return<div style={{marginTop:10,padding:"10px",background:C.surface,borderRadius:8}}>
    <div style={{display:"flex",gap:6,marginBottom:8}}>
      <Inp placeholder="เพิ่มหมวดหมู่ใหม่" value={nv} onChange={e=>setNv(e.target.value)} style={{flex:1}}/>
      <Btn sm onClick={()=>{if(nv.trim()&&!cats.includes(nv.trim())){setCats(p=>[...p,nv.trim()]);setNv("");}}}>+ เพิ่ม</Btn>
    </div>
    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
      {cats.map((c,i)=><div key={c} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:99,padding:"3px 10px",fontSize:12,display:"flex",alignItems:"center",gap:4}}>
        {c}<IBtn onClick={()=>setCats(p=>p.filter((_,j)=>j!==i))} title="ลบ">✕</IBtn>
      </div>)}
    </div>
  </div>;
}

// ── Mini charts ──
function MiniBar({data}){
  const max=Math.max(...data.map(d=>Math.max(d.inc,d.exp)),1);
  return<div style={{display:"flex",alignItems:"flex-end",gap:4,height:72}}>
    {data.map((d,i)=><div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
      <div style={{width:"100%",display:"flex",gap:1,alignItems:"flex-end",height:58}}>
        <div style={{flex:1,background:C.em+"99",borderRadius:"2px 2px 0 0",height:`${(d.inc/max)*100}%`,minHeight:2}}/>
        <div style={{flex:1,background:C.coral+"99",borderRadius:"2px 2px 0 0",height:`${(d.exp/max)*100}%`,minHeight:2}}/>
      </div>
      <div style={{fontSize:9,color:C.muted}}>{d.label}</div>
    </div>)}
  </div>;
}
function Donut({slices,size=90}){
  const total=slices.reduce((s,x)=>s+x.value,0);
  if(!total)return<div style={{width:size,height:size,borderRadius:"50%",background:C.border}}/>;
  let off=0;const r=40,circ=2*Math.PI*r;
  return<svg width={size} height={size} viewBox="0 0 100 100">
    {slices.map((s,i)=>{const pct=s.value/total,dash=pct*circ,gap=circ-dash;
      const el=<circle key={i} cx={50} cy={50} r={r} fill="none" stroke={s.color} strokeWidth={18} strokeDasharray={`${dash} ${gap}`} strokeDashoffset={-off*circ} style={{transform:"rotate(-90deg)",transformOrigin:"50% 50%"}}/>;
      off+=pct;return el;})}
    <circle cx={50} cy={50} r={31} fill={C.card}/>
  </svg>;
}

// ── Backup ──
function BackupBar(){return null;} // removed — use SheetsSync instead

function Overview({incomes,expenses,installments,instPayments,ccDebts,ccPayments,pockets,investments}){
  const[vm,setVm]=useState(thisMonth());
  const instDue=useMemo(()=>installments.filter(inst=>{const[sy,sm]=inst.startMonth.split("-").map(Number);const[vy,vm2]=vm.split("-").map(Number);const d=(vy-sy)*12+(vm2-sm);return d>=0&&d<inst.totalMonths;}),[installments,vm]);
  const inc=useMemo(()=>incomes.filter(e=>e.month===vm).reduce((s,e)=>s+e.amount,0),[incomes,vm]);
  const exp=useMemo(()=>expenses.filter(e=>e.month===vm).reduce((s,e)=>s+e.amount,0),[expenses,vm]);
  const instTot=instDue.reduce((s,i)=>s+i.monthly,0);
  // CC due next month show in that month
  const ccDueThisMonth=useMemo(()=>{
    const prevMk=addMonths(vm,-1);
    const prevCC=expenses.filter(e=>e.month===prevMk&&e.payMethod==="บัตรเครดิต"&&e.ccDeferred);
    const total=prevCC.reduce((s,e)=>s+e.amount,0);
    return total;
  },[expenses,vm]);
  const disp=inc-exp-instTot-ccDueThisMonth;
  const totSav=pockets.reduce((s,p)=>s+p.amount,0);
  const expCats=useMemo(()=>{const m={};expenses.filter(e=>e.month===vm).forEach(e=>{m[e.category]=(m[e.category]||0)+e.amount;});instDue.forEach(i=>{m["ผ่อนชำระ"]=(m["ผ่อนชำระ"]||0)+i.monthly;});if(ccDueThisMonth>0)m["CC ค้างชำระ"]=(m["CC ค้างชำระ"]||0)+ccDueThisMonth;return m;},[expenses,instDue,vm,ccDueThisMonth]);
  const catC=[C.coral,C.violet,C.amber,C.em,C.blue,"#FF8C42","#D4537E"];
  const barData=useMemo(()=>Array.from({length:5},(_,i)=>{
    const mk=addMonths(vm,i-2);
    const ii=incomes.filter(e=>e.month===mk).reduce((s,e)=>s+e.amount,0);
    const ee=expenses.filter(e=>e.month===mk).reduce((s,e)=>s+e.amount,0);
    const iD=installments.filter(inst=>{const[sy,sm]=inst.startMonth.split("-").map(Number);const[vy,vm2]=mk.split("-").map(Number);const d=(vy-sy)*12+(vm2-sm);return d>=0&&d<inst.totalMonths;}).reduce((s,i)=>s+i.monthly,0);
    return{label:monthLabel(mk),inc:ii,exp:ee+iD};
  }),[incomes,expenses,installments,vm]);
  return<div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <Btn color={C.border} style={{color:C.text,padding:"5px 12px"}} onClick={()=>setVm(m=>addMonths(m,-1))}>‹</Btn>
      <span style={{fontWeight:700,fontSize:16,minWidth:90,textAlign:"center"}}>{monthLabel(vm)}</span>
      <Btn color={C.border} style={{color:C.text,padding:"5px 12px"}} onClick={()=>setVm(m=>addMonths(m,1))}>›</Btn>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8}}>
      <MCard label="รายรับ" value={fmt(inc)} color={C.em}/>
      <MCard label="รายจ่าย" value={fmt(exp+instTot)} color={C.coral}/>
      <MCard label="ผ่อน+CC ค้าง" value={fmt(instTot+ccDueThisMonth)} color={C.amber} sub={`ผ่อน ${instDue.length} | CC ${ccDueThisMonth>0?"มียอด":"ไม่มี"}`}/>
      <MCard label="เงินใช้ได้จริง" value={fmt(disp)} color={disp>=0?C.em:C.coral}/>
      <MCard label="เงินเก็บรวม" value={fmt(totSav)} color={C.violet}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1rem"}}>
      <Card><SL>รายรับ vs รายจ่าย (5 เดือน)</SL><MiniBar data={barData}/><div style={{display:"flex",gap:12,marginTop:6}}><span style={{fontSize:11,color:C.em}}>● รายรับ</span><span style={{fontSize:11,color:C.coral}}>● รายจ่าย</span></div></Card>
      <Card><SL>สัดส่วนรายจ่าย</SL>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <Donut slices={Object.keys(expCats).map((k,i)=>({value:expCats[k],color:catC[i%catC.length]}))}/>
          <div style={{flex:1}}>{Object.keys(expCats).map((k,i)=><div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}><span style={{color:catC[i%catC.length]}}>● {k}</span><span style={{color:C.subtext}}>{fmt(expCats[k])}</span></div>)}{Object.keys(expCats).length===0&&<span style={{fontSize:12,color:C.muted}}>ไม่มีข้อมูล</span>}</div>
        </div>
      </Card>
    </div>
    {instDue.length>0&&<Card><SL>ยอดผ่อนค้างชำระเดือนนี้</SL>
      {instDue.map(inst=>{const[sy,sm]=inst.startMonth.split("-").map(Number);const[vy,vm2]=vm.split("-").map(Number);const paid=(vy-sy)*12+(vm2-sm)+1;const pymts=instPayments.filter(p=>p.instId===inst.id&&p.month===vm);const isPaid=pymts.length>0;
        return<div key={inst.id} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:13}}>{inst.name}</span><div style={{display:"flex",alignItems:"center",gap:8}}>{isPaid?<Badge label="✓ ชำระเสร็จสิ้น" color={C.em}/>:<Badge label="⚠ ค้างชำระ" color={C.amber}/>}<span style={{fontWeight:600,color:C.amber}}>{fmt(inst.monthly)}</span></div></div><PBar pct={Math.round(paid/inst.totalMonths*100)} color={isPaid?C.em:C.amber}/></div>;
      })}
    </Card>}
  </div>;
}

// ══════════════════════════════════════════
// INCOME TAB
// ══════════════════════════════════════════
function IncomeTab({incomes,setIncomes,cats,setCats,pockets,setPockets,currencies}){
  const[f,setF]=useState({cat:cats[0]||"เงินเดือน",desc:"",amount:"",month:thisMonth(),cur:"THB"});
  const[showCM,setSCM]=useState(false);
  const mainPocket=pockets.find(p=>p.isMain);
  const add=()=>{
    if(!f.desc||!f.amount||!f.month)return;
    const amt=parseFloat(f.amount);
    setIncomes(p=>[...p,{id:uid(),category:f.cat,desc:f.desc,amount:amt,month:f.month,cur:f.cur}]);
    if(mainPocket)setPockets(p=>p.map(pk=>pk.isMain?{...pk,amount:pk.amount+amt}:pk));
    setF(p=>({...p,desc:"",amount:""}));
  };
  const totByM=useMemo(()=>{const m={};incomes.forEach(e=>{m[e.month]=(m[e.month]||0)+e.amount;});return m;},[incomes]);
  return<div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
    <Card>
      <SL>เพิ่มรายรับ</SL>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <Sel value={f.cat} onChange={e=>setF(p=>({...p,cat:e.target.value}))}>{cats.map(c=><option key={c}>{c}</option>)}</Sel>
        <Inp placeholder="รายละเอียด" value={f.desc} onChange={e=>setF(p=>({...p,desc:e.target.value}))}/>
        <div style={{display:"flex",gap:6}}><Inp type="number" placeholder="จำนวนเงิน" value={f.amount} onChange={e=>setF(p=>({...p,amount:e.target.value}))} style={{flex:1}}/><CurSel value={f.cur} onChange={v=>setF(p=>({...p,cur:v}))} currencies={currencies}/></div>
        <Inp type="month" value={f.month} onChange={e=>setF(p=>({...p,month:e.target.value}))}/>
      </div>
      {mainPocket&&<div style={{fontSize:12,color:C.em,marginBottom:8}}>💡 เงินจะเข้า "{mainPocket.name}" อัตโนมัติ</div>}
      <div style={{display:"flex",gap:8}}><Btn onClick={add}>+ เพิ่มรายรับ</Btn><Btn color={C.border} style={{color:C.text}} onClick={()=>setSCM(p=>!p)}>จัดการหมวดหมู่</Btn></div>
      {showCM&&<CatManager cats={cats} setCats={setCats}/>}
    </Card>
    <Card><SL>รายรับทั้งหมด</SL>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr><TH>เดือน</TH><TH>หมวด</TH><TH>รายละเอียด</TH><TH right>จำนวน</TH><TH></TH></tr></thead>
        <tbody>
          {[...incomes].reverse().map(e=><tr key={e.id}><TD>{e.month}</TD><TD><Badge label={e.category} color={C.em}/></TD><TD>{e.desc}</TD><TD right style={{color:C.em,fontWeight:600}}>{fmtC(e.amount,e.cur||"THB")}</TD><TD><IBtn onClick={()=>{if(mainPocket)setPockets(p=>p.map(pk=>pk.isMain?{...pk,amount:Math.max(0,pk.amount-e.amount)}:pk));setIncomes(p=>p.filter(x=>x.id!==e.id));}} title="ลบ">🗑</IBtn></TD></tr>)}
          {incomes.length===0&&<ERow cols={5}/>}
        </tbody>
      </table></div>
      {Object.keys(totByM).length>0&&<div style={{marginTop:10,display:"flex",flexWrap:"wrap",gap:6}}>{Object.entries(totByM).sort().map(([mk,t])=><div key={mk} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"3px 8px",fontSize:12}}>{monthLabel(mk)}: <span style={{color:C.em,fontWeight:600}}>{fmt(t)}</span></div>)}</div>}
    </Card>
  </div>;
}

// ══════════════════════════════════════════
// EXPENSE TAB
// ══════════════════════════════════════════
function ExpenseTab({expenses,setExpenses,expCats,setExpCats,installments,setInstallments,instPayments,setInstPayments,ccDebts,setCcDebts,ccPayments,setCcPayments,pockets,setPockets,currencies,pendingAdd}){
  const[f,setF]=useState({cat:expCats[0]||"อาหาร",desc:"",amount:"",month:thisMonth(),cur:"THB",payMethod:"เงินสด",ccDeferred:false,isInst:false,monthly:"",totalMonths:""});
  const[vm,setVm]=useState(thisMonth());
  const[showCM,setSCM]=useState(false);
  const[payModal,setPayModal]=useState(null); // {type:'inst'|'cc', id, month, amount, name}
  const[expSlipStatus,setExpSlipStatus]=useState(null);
  const readExpSlip=async e=>{
    const file=e.target.files[0];if(!file)return;
    setExpSlipStatus("loading");
    const gemKey=localStorage.getItem("fcc6_gemini_key");
    if(!gemKey){alert("กรุณาตั้งค่า Gemini API Key ในหน้าการลงทุน");setExpSlipStatus(null);e.target.value="";return;}
    const toB64=f=>new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=er;r.readAsDataURL(f);});
    try{
      const b64=await toB64(file);
      const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${gemKey}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[
          {text:'วิเคราะห์ slip ค่าใช้จ่าย ตอบ JSON เท่านั้น ไม่มี markdown: {"name":"รายละเอียด","amount":จำนวนเงิน,"date":"YYYY-MM-DD","category":"หมวดหมู่ เช่น อาหาร/เดินทาง/ช้อปปิ้ง","cur":"THB หรือ USD"}'},
          {inline_data:{mime_type:file.type,data:b64}}
        ]}]})
      });
      const data=await resp.json();
      const text=data.candidates?.[0]?.content?.parts?.[0]?.text||"{}";
      const d=JSON.parse(text.replace(/```json|```/g,"").trim());
      if(pendingAdd) pendingAdd({name:d.name||"รายจ่ายจาก slip",amount:d.amount||0,date:d.date||today(),type:"ค่าใช้จ่าย",category:d.category||"อื่นๆ",cur:d.cur||"THB"});
      setExpSlipStatus("ok");setTimeout(()=>setExpSlipStatus(null),3000);
    }catch(er){console.error(er);setExpSlipStatus("error");setTimeout(()=>setExpSlipStatus(null),3000);}
    e.target.value="";
  };

  const payMethods=useMemo(()=>["เงินสด","บัตรเครดิต","บัตรเดบิต",...pockets.map(p=>p.name)],[pockets]);

  const add=()=>{
    if(!f.desc||!f.amount||!f.month)return;
    const amt=parseFloat(f.amount);
    if(f.isInst){
      if(!f.monthly||!f.totalMonths)return;
      setInstallments(p=>[...p,{id:uid(),name:f.desc,category:f.cat,totalAmount:amt,monthly:parseFloat(f.monthly),totalMonths:parseInt(f.totalMonths),startMonth:f.month,cur:f.cur}]);
    }else{
      const entry={id:uid(),category:f.cat,desc:f.desc,amount:amt,month:f.month,cur:f.cur,payMethod:f.payMethod,ccDeferred:f.payMethod==="บัตรเครดิต"?f.ccDeferred:false};
      setExpenses(p=>[...p,entry]);
      // deduct from named pocket
      if(f.payMethod!=="เงินสด"&&f.payMethod!=="บัตรเครดิต"&&f.payMethod!=="บัตรเดบิต"){
        const pk=pockets.find(p=>p.name===f.payMethod);
        if(pk)setPockets(p=>p.map(x=>x.id===pk.id?{...x,amount:Math.max(0,x.amount-amt)}:x));
      }
    }
    setF(p=>({...p,desc:"",amount:"",monthly:"",totalMonths:"",isInst:false,ccDeferred:false}));
  };

  const instDue=useMemo(()=>installments.filter(inst=>{const[sy,sm]=inst.startMonth.split("-").map(Number);const[vy,vm2]=vm.split("-").map(Number);const d=(vy-sy)*12+(vm2-sm);return d>=0&&d<inst.totalMonths;}),[installments,vm]);

  // CC debt: expenses with ccDeferred=true group by prevMonth → show in next month
  const ccDueThisMonth=useMemo(()=>{
    const prevMk=addMonths(vm,-1);
    return expenses.filter(e=>e.month===prevMk&&e.payMethod==="บัตรเครดิต"&&e.ccDeferred);
  },[expenses,vm]);
  const ccDueTotal=ccDueThisMonth.reduce((s,e)=>s+e.amount,0);
  const ccPaidThisMonth=ccPayments.filter(p=>p.month===vm);
  const ccIsPaid=ccPaidThisMonth.length>0;

  const doInstPay=(inst)=>{setPayModal({type:"inst",id:inst.id,month:vm,amount:inst.monthly,name:inst.name});};
  const doCCPay=()=>{setPayModal({type:"cc",month:vm,amount:ccDueTotal,name:`ยอด CC เดือน ${monthLabel(addMonths(vm,-1))}`});};

  return<div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
    {/* Pay Modal */}
    {payModal&&<PayModal modal={payModal} pockets={pockets} setPockets={setPockets} instPayments={instPayments} setInstPayments={setInstPayments} ccPayments={ccPayments} setCcPayments={setCcPayments} onClose={()=>setPayModal(null)}/>}

    <Card>
      <SL>เพิ่มรายจ่าย</SL>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
        <Sel value={f.cat} onChange={e=>setF(p=>({...p,cat:e.target.value}))}>{expCats.map(c=><option key={c}>{c}</option>)}</Sel>
        <Inp placeholder="รายละเอียด" value={f.desc} onChange={e=>setF(p=>({...p,desc:e.target.value}))}/>
        <div style={{display:"flex",gap:6}}><Inp type="number" placeholder="จำนวนเงิน" value={f.amount} onChange={e=>setF(p=>({...p,amount:e.target.value}))} style={{flex:1}}/><CurSel value={f.cur} onChange={v=>setF(p=>({...p,cur:v}))} currencies={currencies}/></div>
        <Inp type="month" value={f.month} onChange={e=>setF(p=>({...p,month:e.target.value}))}/>
        <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>ช่องทางชำระ</div>
          <Sel value={f.payMethod} onChange={e=>setF(p=>({...p,payMethod:e.target.value}))}>{payMethods.map(m=><option key={m}>{m}</option>)}</Sel>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {f.payMethod==="บัตรเครดิต"&&<label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer",color:C.amber}}><input type="checkbox" checked={f.ccDeferred} onChange={e=>setF(p=>({...p,ccDeferred:e.target.checked}))}/> ผ่อนบัตรเครดิต (ค้างชำระถึงเดือนหน้า)</label>}
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer"}}><input type="checkbox" checked={f.isInst} onChange={e=>setF(p=>({...p,isInst:e.target.checked}))}/> ยอดผ่อนชำระ</label>
        </div>
      </div>
      {f.isInst&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8,padding:"10px",background:C.surface,borderRadius:8}}>
        <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>ผ่อนต่อเดือน</div><Inp type="number" value={f.monthly} onChange={e=>setF(p=>({...p,monthly:e.target.value}))}/></div>
        <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>จำนวนงวด</div><Inp type="number" value={f.totalMonths} onChange={e=>setF(p=>({...p,totalMonths:e.target.value}))}/></div>
        {f.monthly&&f.totalMonths&&<div style={{gridColumn:"span 2",fontSize:12,color:C.amber}}>ยอดรวม: {fmt(parseFloat(f.monthly)*parseInt(f.totalMonths))} · สิ้นสุด: {monthLabel(addMonths(f.month,parseInt(f.totalMonths)-1))}</div>}
      </div>}
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <Btn onClick={add} color={f.isInst?C.amber:C.em}>+ {f.isInst?"บันทึกยอดผ่อน":"เพิ่มรายจ่าย"}</Btn>
        <Btn color={C.border} style={{color:C.text}} onClick={()=>setSCM(p=>!p)}>จัดการหมวดหมู่</Btn>
      </div>
      {showCM&&<CatManager cats={expCats} setCats={setExpCats}/>}
    </Card>
    <Card style={{padding:"12px 16px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <SL style={{margin:0}}>📎 สแกน Slip ค่าใช้จ่าย (Gemini AI)</SL>
        {expSlipStatus==="loading"&&<span style={{fontSize:11,color:C.muted}}>⏳ กำลังวิเคราะห์...</span>}
        {expSlipStatus==="ok"&&<span style={{fontSize:11,color:C.em}}>✅ เพิ่มใน Pending แล้ว</span>}
        {expSlipStatus==="error"&&<span style={{fontSize:11,color:C.coral}}>❌ อ่านไม่ได้</span>}
      </div>
      <label style={{cursor:"pointer",display:"inline-block"}}>
        <Btn sm color={C.violet} style={{color:"#fff"}} disabled={expSlipStatus==="loading"}>📷 สแกน Slip → Pending List</Btn>
        <input type="file" accept="image/*" style={{display:"none"}} onChange={readExpSlip} disabled={expSlipStatus==="loading"}/>
      </label>
      <div style={{fontSize:11,color:C.muted,marginTop:6}}>Gemini AI จะอ่าน slip แล้วส่งไปที่ Pending List ให้กดยืนยันก่อนบันทึก</div>
    </Card>

    {/* Debt Manager */}
    <Card>
      <SL>Debt Manager — ยอดผ่อน</SL>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr><TH>รายการ</TH><TH right>ยอดเต็ม</TH><TH right>ผ่อน/เดือน</TH><TH>ความคืบหน้า</TH><TH right>เหลือ</TH><TH></TH></tr></thead>
        <tbody>
          {installments.map(inst=>{const[sy,sm]=inst.startMonth.split("-").map(Number);const[cy,cm]=thisMonth().split("-").map(Number);const paid=clamp((cy-sy)*12+(cm-sm)+1,0,inst.totalMonths);const rem=(inst.totalMonths-paid)*inst.monthly;
            return<tr key={inst.id}><TD><div style={{fontWeight:600}}>{inst.name}</div><div style={{fontSize:11,color:C.muted}}>เริ่ม {monthLabel(inst.startMonth)}</div></TD><TD right>{fmt(inst.totalAmount)}</TD><TD right style={{color:C.amber,fontWeight:600}}>{fmt(inst.monthly)}</TD><TD style={{minWidth:100}}><div style={{fontSize:11,color:C.muted,marginBottom:2}}>{paid}/{inst.totalMonths} ({Math.round(paid/inst.totalMonths*100)}%)</div><PBar pct={Math.round(paid/inst.totalMonths*100)} color={paid>=inst.totalMonths?C.em:C.amber}/></TD><TD right style={{color:rem>0?C.coral:C.em}}>{fmt(rem)}</TD><TD><IBtn onClick={()=>setInstallments(p=>p.filter(x=>x.id!==inst.id))} title="ลบ">🗑</IBtn></TD></tr>;
          })}
          {installments.length===0&&<ERow cols={6} msg="ยังไม่มียอดผ่อน"/>}
        </tbody>
      </table></div>
    </Card>

    {/* Monthly View */}
    <Card>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
        <SL style={{margin:0}}>รายจ่ายประจำเดือน</SL>
        <div style={{display:"flex",gap:5,marginLeft:"auto"}}>
          <Btn color={C.border} style={{color:C.text,padding:"3px 10px",fontSize:12}} onClick={()=>setVm(m=>addMonths(m,-1))}>‹</Btn>
          <span style={{fontSize:13,fontWeight:600,minWidth:75,textAlign:"center"}}>{monthLabel(vm)}</span>
          <Btn color={C.border} style={{color:C.text,padding:"3px 10px",fontSize:12}} onClick={()=>setVm(m=>addMonths(m,1))}>›</Btn>
        </div>
      </div>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr><TH>ประเภท</TH><TH>รายละเอียด</TH><TH>หมวด</TH><TH>ชำระผ่าน</TH><TH right>จำนวน</TH><TH>สถานะ</TH><TH></TH></tr></thead>
        <tbody>
          {expenses.filter(e=>e.month===vm).map(e=><tr key={e.id}><TD><Badge label="รายจ่าย" color={C.coral}/></TD><TD>{e.desc}</TD><TD><Badge label={e.category} color={C.violet}/></TD><TD style={{fontSize:11,color:C.muted}}>{e.payMethod||"-"}</TD><TD right style={{color:C.coral,fontWeight:600}}>{fmtC(e.amount,e.cur||"THB")}</TD><TD>{e.ccDeferred?<Badge label="CC ผ่อน→เดือนหน้า" color={C.amber}/>:"-"}</TD><TD><IBtn onClick={()=>setExpenses(p=>p.filter(x=>x.id!==e.id))} title="ลบ">🗑</IBtn></TD></tr>)}
          {/* Installment due */}
          {instDue.map(inst=>{
            const[sy,sm]=inst.startMonth.split("-").map(Number);const[vy,vm2]=vm.split("-").map(Number);const paid=(vy-sy)*12+(vm2-sm)+1;
            const isPaid=instPayments.some(p=>p.instId===inst.id&&p.month===vm);
            return<tr key={inst.id}><TD><Badge label="ผ่อน" color={C.amber}/></TD><TD>{inst.name}</TD><TD style={{fontSize:11,color:C.muted}}>งวด {paid}/{inst.totalMonths}</TD><TD>-</TD><TD right style={{color:C.amber,fontWeight:600}}>{fmt(inst.monthly)}</TD>
              <TD>{isPaid?<Badge label="✓ ชำระเสร็จสิ้น" color={C.em}/>:<Btn sm color={C.amber} onClick={()=>doInstPay(inst)}>⚠ ชำระหนี้</Btn>}</TD><TD></TD>
            </tr>;
          })}
          {/* CC due from last month */}
          {ccDueThisMonth.length>0&&<tr style={{background:C.amber+"11"}}>
            <TD colSpan={3}><Badge label="บัตรเครดิต" color={C.amber}/> <span style={{fontSize:12}}>ยอดค้างจาก {monthLabel(addMonths(vm,-1))} ({ccDueThisMonth.length} รายการ)</span></TD>
            <TD>บัตรเครดิต</TD>
            <TD right style={{color:C.amber,fontWeight:700}}>{fmt(ccDueTotal)}</TD>
            <TD>{ccIsPaid?<Badge label="✓ ชำระเสร็จสิ้น" color={C.em}/>:<Btn sm color={C.amber} onClick={doCCPay}>⚠ ชำระหนี้</Btn>}</TD>
            <TD></TD>
          </tr>}
          {expenses.filter(e=>e.month===vm).length===0&&instDue.length===0&&ccDueThisMonth.length===0&&<ERow cols={7}/>}
        </tbody>
      </table></div>
    </Card>
  </div>;
}

// ── Pay Modal ──
function PayModal({modal,pockets,setPockets,instPayments,setInstPayments,ccPayments,setCcPayments,onClose}){
  const[from,setFrom]=useState("");
  const doPay=()=>{
    if(!from){alert("กรุณาเลือก Pocket");return;}
    const pk=pockets.find(p=>p.id===from);
    if(!pk||pk.amount<modal.amount){alert("เงินใน Pocket ไม่พอ");return;}
    setPockets(p=>p.map(x=>x.id===from?{...x,amount:Math.max(0,x.amount-modal.amount)}:x));
    if(modal.type==="inst"){
      setInstPayments(p=>[...p,{id:uid(),instId:modal.id,month:modal.month,amount:modal.amount,fromPocket:pk.name,date:today()}]);
    }else{
      setCcPayments(p=>[...p,{id:uid(),month:modal.month,amount:modal.amount,fromPocket:pk.name,date:today()}]);
    }
    onClose();
  };
  return<Modal title={`ชำระหนี้: ${modal.name}`} onClose={onClose}>
    <div style={{marginBottom:12,padding:"10px",background:C.surface,borderRadius:8}}>
      <div style={{fontSize:13,color:C.muted,marginBottom:4}}>ยอดที่ต้องชำระ</div>
      <div style={{fontSize:22,fontWeight:800,color:C.amber}}>{fmt(modal.amount)}</div>
    </div>
    <div style={{marginBottom:12}}>
      <div style={{fontSize:11,color:C.muted,marginBottom:5}}>เลือก Cloud Pocket ที่จะโอนเงินชำระ</div>
      <Sel value={from} onChange={e=>setFrom(e.target.value)}>
        <option value="">-- เลือก Pocket --</option>
        {pockets.map(p=><option key={p.id} value={p.id}>{p.name} (มี {fmt(p.amount)})</option>)}
      </Sel>
      {from&&pockets.find(p=>p.id===from)&&<div style={{fontSize:12,color:C.muted,marginTop:5}}>ยอดคงเหลือหลังชำระ: {fmt(Math.max(0,(pockets.find(p=>p.id===from)?.amount||0)-modal.amount))}</div>}
    </div>
    <div style={{display:"flex",gap:8}}>
      <Btn onClick={doPay} color={C.em}>✓ ยืนยันชำระหนี้</Btn>
      <Btn onClick={onClose} color={C.border} style={{color:C.text}}>ยกเลิก</Btn>
    </div>
  </Modal>;
}

// SAVING TAB
// ══════════════════════════════════════════
function SavingTab({pockets,setPockets,transfers,setTransfers}){
  const[f,setF]=useState({name:"",amount:"",goal:""});
  const[tf,setTf]=useState({from:"",to:"",amount:""});
  const mainPocket=pockets.find(p=>p.isMain)||{id:MAIN_PID,name:"Cash Box",amount:0,isMain:true};
  const others=pockets.filter(p=>!p.isMain);
  const total=pockets.reduce((s,p)=>s+p.amount,0);

  useEffect(()=>{if(!pockets.find(p=>p.isMain))setPockets(p=>[{id:MAIN_PID,name:"Cash Box",amount:0,goal:0,isMain:true},...p]);},[]);

  const addPocket=()=>{if(!f.name)return;setPockets(p=>[...p,{id:uid(),name:f.name,amount:parseFloat(f.amount)||0,goal:parseFloat(f.goal)||0,isMain:false}]);setF({name:"",amount:"",goal:""});};
  const delPocket=id=>{const t=pockets.find(p=>p.id===id);if(!t)return;setPockets(p=>p.filter(x=>x.id!==id).map(pk=>pk.isMain?{...pk,amount:pk.amount+t.amount}:pk));};
  const deposit=id=>{const a=parseFloat(prompt("เพิ่มเงิน (บาท):")||0);if(isNaN(a)||a<=0)return;setPockets(p=>p.map(pk=>pk.id===id?{...pk,amount:pk.amount+a}:pk));};
  const doTf=()=>{
    const a=parseFloat(tf.amount);if(!tf.from||!tf.to||tf.from===tf.to||isNaN(a)||a<=0)return;
    const fp=pockets.find(p=>p.id===tf.from);if(!fp||fp.amount<a){alert("เงินไม่พอ");return;}
    const tp=pockets.find(p=>p.id===tf.to);
    setPockets(p=>p.map(pk=>pk.id===tf.from?{...pk,amount:pk.amount-a}:pk.id===tf.to?{...pk,amount:pk.amount+a}:pk));
    setTransfers(p=>[...p,{id:uid(),from:fp.name,to:tp.name,amount:a,date:today()}]);
    setTf(p=>({...p,amount:""}));
  };
  const pC=[C.em,C.violet,C.amber,C.blue,C.coral,"#FF8C42"];
  return<div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8}}>
      <MCard label="เงินเก็บทั้งหมด" value={fmt(total)} color={C.violet}/>
      <MCard label="Cash Box" value={fmt(mainPocket.amount)} color={C.em}/>
      <MCard label="จำนวน Pocket" value={others.length}/>
    </div>
    {/* Main Pocket */}
    <Card style={{borderColor:C.em+"55",borderWidth:2}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <span style={{fontSize:15,fontWeight:700,color:C.em}}>☁ {mainPocket.name}</span>
          <Badge label="MAIN · ลบไม่ได้" color={C.em}/>
        </div><div style={{fontSize:11,color:C.muted}}>รายรับทุกรายการเข้าที่นี่ก่อน แล้วค่อยจัดสรรไป Pocket อื่น</div></div>
        <div style={{fontSize:24,fontWeight:800,color:C.em}}>{fmt(mainPocket.amount)}</div>
      </div>
      <div style={{marginTop:8}}><Btn sm color={C.em} onClick={()=>deposit(mainPocket.id)}>+ เพิ่มเงิน</Btn></div>
    </Card>
    <Card>
      <SL>สร้าง Pocket ใหม่</SL>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
        <Inp placeholder="ชื่อ Pocket" value={f.name} onChange={e=>setF(p=>({...p,name:e.target.value}))}/>
        <Inp type="number" placeholder="ยอดเริ่มต้น" value={f.amount} onChange={e=>setF(p=>({...p,amount:e.target.value}))}/>
        <Inp type="number" placeholder="เป้าหมาย" value={f.goal} onChange={e=>setF(p=>({...p,goal:e.target.value}))}/>
      </div>
      <Btn sm color={C.violet} style={{color:"#fff"}} onClick={addPocket}>+ สร้าง</Btn>
    </Card>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:8}}>
      {others.map((pk,i)=>{const color=pC[i%pC.length],pct=pk.goal>0?Math.round(pk.amount/pk.goal*100):null;
        return<Card key={pk.id} style={{borderColor:color+"44"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}><span style={{fontSize:13,fontWeight:600,color}}>{pk.name}</span><IBtn onClick={()=>{if(confirm(`ลบ "${pk.name}"?\nยอด ${fmt(pk.amount)} คืนสู่ Pocket กลาง`))delPocket(pk.id);}} title="ลบ">✕</IBtn></div>
          <div style={{fontSize:19,fontWeight:700,color,marginBottom:4}}>{fmt(pk.amount)}</div>
          {pk.goal>0&&<><div style={{fontSize:11,color:C.muted,marginBottom:3}}>เป้า {fmt(pk.goal)} · {pct}%</div><PBar pct={pct} color={color}/></>}
          <Btn sm color={color} style={{color:color===C.em||color===C.amber?C.ink:"#fff",marginTop:8,width:"100%"}} onClick={()=>deposit(pk.id)}>+ เพิ่มเงิน</Btn>
        </Card>;
      })}
      {others.length===0&&<div style={{textAlign:"center",color:C.muted,padding:"1.5rem",fontSize:13}}>ยังไม่มี Pocket เพิ่มเติม</div>}
    </div>
    <Card>
      <SL>โยกย้ายเงิน</SL>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",gap:8,alignItems:"end"}}>
        <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>จาก</div><Sel value={tf.from} onChange={e=>setTf(p=>({...p,from:e.target.value}))}><option value="">เลือก</option>{pockets.map(p=><option key={p.id} value={p.id}>{p.name} ({fmt(p.amount)})</option>)}</Sel></div>
        <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>ไปยัง</div><Sel value={tf.to} onChange={e=>setTf(p=>({...p,to:e.target.value}))}><option value="">เลือก</option>{pockets.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</Sel></div>
        <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>จำนวน (บาท)</div><Inp type="number" placeholder="0" value={tf.amount} onChange={e=>setTf(p=>({...p,amount:e.target.value}))}/></div>
        <Btn color={C.violet} style={{color:"#fff"}} onClick={doTf}>โยก</Btn>
      </div>
    </Card>
    {transfers.length>0&&<Card><SL>ประวัติการโยกย้าย</SL>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr><TH>วันที่</TH><TH>จาก</TH><TH>ไปยัง</TH><TH right>จำนวน</TH></tr></thead>
        <tbody>{[...transfers].reverse().slice(0,10).map(t=><tr key={t.id}><TD style={{fontSize:11,color:C.muted}}>{t.date}</TD><TD>{t.from}</TD><TD>{t.to}</TD><TD right style={{color:C.violet,fontWeight:600}}>{fmt(t.amount)}</TD></tr>)}</tbody>
      </table></div>
    </Card>}
  </div>;
}

// INVEST TAB

function InvestTab({investments,setInvestments,invCurrencies,setInvCurrencies,pockets,setPockets,pendingAdd}){
  const defCur=invCurrencies[0]||"USD";
  const[buyF,setBF]=useState({type:"หุ้น",name:"",date:today(),qty:"",price:"",fee:"",totalCost:"",cur:defCur});
  const[sellF,setSF]=useState({key:"",qty:"",price:"",fee:"",totalCost:"",date:today(),cur:defCur});
  const[slip,setSlip]=useState(null);
  const[filterType,setFT]=useState("ทั้งหมด");
  const[filterAsset,setFA]=useState("ทั้งหมด");
  const[showCurMgr,setSCM]=useState(false);
  const[newCur,setNC]=useState("");
  const[savedNames,setSavedNames]=useLS("fcc5_inv_names",[]);
  const[showNameDd,setShowNameDd]=useState(false);

  // ── Auto-fill name when type=Gold ──
  const handleTypeChange=val=>{
    setBF(p=>({...p,type:val,name:val==="ทองคำ"?"GOLD":p.name}));
  };

  // ── Auto calc buy ──
  const handleBuy=(field,val)=>{
    setBF(p=>{
      const n={...p,[field]:val};
      const pr=parseFloat(n.price)||0,fee=parseFloat(n.fee)||0,qty=parseFloat(n.qty)||0,tot=parseFloat(n.totalCost)||0;
      if((field==="totalCost"||field==="price"||field==="fee")&&tot>0&&pr>0) n.qty=String(fmtN((tot-fee)/pr,6));
      if((field==="qty"||field==="price"||field==="fee")&&qty>0&&pr>0) n.totalCost=String(fmtN(qty*pr+fee,2));
      return n;
    });
  };

  // ── Auto calc sell ──
  const handleSell=(field,val)=>{
    setSF(p=>{
      const n={...p,[field]:val};
      const pr=parseFloat(n.price)||0,fee=parseFloat(n.fee)||0,qty=parseFloat(n.qty)||0,tot=parseFloat(n.totalCost)||0;
      if((field==="totalCost"||field==="price"||field==="fee")&&tot>0&&pr>0) n.qty=String(fmtN((tot-fee)/pr,6));
      if((field==="qty"||field==="price"||field==="fee")&&qty>0&&pr>0) n.totalCost=String(fmtN(qty*pr+fee,2));
      return n;
    });
  };

  const getAvg=useCallback(key=>{let q=0,c=0;investments.filter(t=>t.key===key&&t.action==="buy").forEach(t=>{q+=t.qty;c+=t.totalCost;});return q>0?c/q:0;},[investments]);

  const portfolio=useMemo(()=>{
    const p={};
    investments.filter(t=>t.action==="buy").forEach(t=>{if(!p[t.key])p[t.key]={key:t.key,type:t.type,name:t.name,qty:0,totalCost:0,cur:t.cur};p[t.key].qty+=t.qty;p[t.key].totalCost+=t.totalCost;});
    investments.filter(t=>t.action==="sell").forEach(t=>{if(p[t.key])p[t.key].qty=Math.max(0,p[t.key].qty-t.qty);});
    return Object.values(p).filter(p=>p.qty>0.000001);
  },[investments]);

  const totCost=investments.filter(t=>t.action==="buy").reduce((s,t)=>s+t.totalCost,0);
  const totPnl=useMemo(()=>investments.filter(t=>t.action==="sell").reduce((s,t)=>s+(t.price-getAvg(t.key))*t.qty-(t.fee||0),0),[investments,getAvg]);

  const addBuy=()=>{
    if(!buyF.name||!buyF.date||!buyF.qty||!buyF.price)return;
    const qty=parseFloat(buyF.qty),price=parseFloat(buyF.price),fee=parseFloat(buyF.fee)||0;
    const nm=buyF.name.trim();
    setInvestments(p=>[...p,{id:uid(),action:"buy",type:buyF.type,name:nm,key:nm.toUpperCase(),date:buyF.date,qty,price,fee,totalCost:qty*price+fee,cur:buyF.cur}]);
    if(nm&&!savedNames.includes(nm)) setSavedNames(p=>[...p,nm]);
    setBF(p=>({...p,name:"",qty:"",price:"",fee:"",totalCost:""}));
  };

  const addSell=(fromPocketId)=>{
    if(!sellF.key||!sellF.date)return;
    const qty=parseFloat(sellF.qty)||0,price=parseFloat(sellF.price)||0;
    if(!qty||!price){alert("กรุณากรอกจำนวนหน่วยและราคาขาย");return;}
    const asset=portfolio.find(p=>p.key===sellF.key);
    if(!asset||qty>asset.qty){alert("จำนวนเกินกว่าที่ถือครอง ("+fmtN(asset?asset.qty:0,4)+" หน่วย)");return;}
    const avg=getAvg(sellF.key),fee=parseFloat(sellF.fee)||0;
    const pnl=(price-avg)*qty-fee;
    const saleProceeds=qty*price-fee;
    setInvestments(p=>[...p,{id:uid(),action:"sell",type:asset.type,name:asset.name,key:sellF.key,date:sellF.date,qty,price,fee,totalCost:qty*price,pnl,cur:sellF.cur}]);
    // Credit proceeds to DIME TRADER pocket (create if not exists, USD)
    setPockets(prev=>{
      const dime=prev.find(p=>p.name==="DIME TRADER");
      if(dime){return prev.map(p=>p.name==="DIME TRADER"?{...p,amount:p.amount+saleProceeds,cur:"USD"}:p);}
      return[...prev,{id:uid(),name:"DIME TRADER",amount:saleProceeds,goal:0,isMain:false,cur:"USD",color:"#E8A020"}];
    });
    setSF(p=>({...p,qty:"",price:"",fee:"",totalCost:""}));
    alert("✅ บันทึกการขายแล้ว · เงินที่ได้ "+fmtN(saleProceeds,2)+" "+sellF.cur+" เข้า DIME TRADER");
  };

  readSlipGemini=async(file,target)=>{
    setSlip("loading");
    const gemKey=localStorage.getItem("fcc6_gemini_key");
    if(!gemKey){alert("กรุณาตั้งค่า Gemini API Key ในส่วน GeminiSlipReader ด้านบน");setSlip(null);return;}
    const toB64=f=>new Promise((ok,er)=>{const r2=new FileReader();r2.onload=()=>ok(r2.result.split(",")[1]);r2.onerror=er;r2.readAsDataURL(f);});
    try{
      const b64=await toB64(file);
      const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${gemKey}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[
          {text:'วิเคราะห์ slip ซื้อขายการลงทุน ตอบ JSON เท่านั้น ไม่มี markdown: {"action":"buy หรือ sell","type":"ทองคำ หรือ หุ้น หรือ กองทุน หรือ คริปโต หรือ อื่นๆ","name":"ชื่อ","date":"YYYY-MM-DD","qty":จำนวน,"price":ราคา/หน่วย,"fee":ค่าธรรมเนียม,"totalCost":ยอดรวม,"cur":"USD หรือ THB"}'},
          {inline_data:{mime_type:file.type,data:b64}}
        ]}]})
      });
      const data=await resp.json();
      const text=data.candidates?.[0]?.content?.parts?.[0]?.text||"{}";
      const d=JSON.parse(text.replace(/```json|```/g,"").trim());
      if(target==="pending"&&pendingAdd){
        pendingAdd({name:(d.name||"?")+" ("+(d.action==="buy"?"ซื้อ":"ขาย")+")",amount:d.totalCost||(d.qty*d.price)||0,date:d.date||today(),type:"การลงทุน",_inv:d});
        setSlip("ok");alert("✅ เพิ่มใน Pending List แล้ว กรุณาตรวจสอบด้านบน");
      } else {
        setBF(p=>({...p,type:d.type||p.type,name:d.name||p.name,date:d.date||p.date,qty:d.qty?String(d.qty):p.qty,price:d.price?String(d.price):p.price,fee:d.fee?String(d.fee):p.fee,totalCost:d.totalCost?String(d.totalCost):p.totalCost,cur:d.cur||p.cur}));
        setSlip("ok");
      }
    }catch(e){console.error(e);setSlip("error");}
  };
  const readSlip=async e=>{const file=e.target.files[0];if(!file)return;await readSlipGemini(file,"fill");e.target.value="";};
  const readSlipPending=async e=>{const file=e.target.files[0];if(!file)return;await readSlipGemini(file,"pending");e.target.value="";}

  const assetTypes=["ทั้งหมด",...[...new Set(investments.map(t=>t.type))]];
  const assetNames=useMemo(()=>["ทั้งหมด",...[...new Set((filterType==="ทั้งหมด"?investments:investments.filter(t=>t.type===filterType)).map(t=>t.name))]]  ,[investments,filterType]);
  useEffect(()=>setFA("ทั้งหมด"),[filterType]);

  const filteredTrades=useMemo(()=>investments.filter(t=>(filterType==="ทั้งหมด"||t.type===filterType)&&(filterAsset==="ทั้งหมด"||t.name===filterAsset)),[investments,filterType,filterAsset]);
  const filteredPnl=useMemo(()=>filteredTrades.filter(t=>t.action==="sell").reduce((s,t)=>s+(t.price-getAvg(t.key))*t.qty-(t.fee||0),0),[filteredTrades,getAvg]);

  const tC={ทองคำ:C.amber,หุ้น:C.blue,กองทุน:C.violet,คริปโต:C.em,อื่นๆ:C.muted};

  return<div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8}}>
      <MCard label="สินทรัพย์ในพอร์ต" value={portfolio.length+" รายการ"} color={C.blue}/>
      <MCard label="ต้นทุนรวม" value={fmtN(totCost,2)} color={C.amber}/>
      <MCard label="กำไร/ขาดทุน Realized" value={(totPnl>=0?"+":"")+fmtN(totPnl,2)} color={totPnl>=0?C.em:C.coral}/>
    </div>

    <GeminiSlipReader pendingAdd={pendingAdd}/>
    <TradingViewWidgets/>
        <Card>
      <SL>📎 อ่าน Slip ด้วย Gemini AI (ในหน้าลงทุน)</SL>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
        <label style={{cursor:"pointer"}}>
          <Btn sm color={slip==="loading"?"#B0C0CC":C.blue} style={{color:"#fff"}} disabled={slip==="loading"}>
            {slip==="loading"?"⏳ กำลังวิเคราะห์...":slip==="ok"?"✅ อ่านสำเร็จ!":slip==="error"?"❌ ลองใหม่":"📷 สแกน Slip → เติมฟอร์ม"}
          </Btn>
          <input type="file" accept="image/*" style={{display:"none"}} onChange={readSlip} disabled={slip==="loading"}/>
        </label>
        <label style={{cursor:"pointer"}}>
          <Btn sm color={C.amber} style={{color:C.ink}}>📋 สแกน Slip → Pending List</Btn>
          <input type="file" accept="image/*" style={{display:"none"}} onChange={readSlipPending}/>
        </label>
      </div>
      <div style={{fontSize:11,color:C.muted}}>เติมฟอร์ม = กรอกข้อมูลซื้อด้านล่างทันที · Pending = รอยืนยันก่อนบันทึก</div>
    </Card>

    {/* Buy */}
    <Card>
      <SL>บันทึกการซื้อ</SL>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
        <Sel value={buyF.type} onChange={e=>handleTypeChange(e.target.value)}>{["ทองคำ","หุ้น","กองทุน","คริปโต","อื่นๆ"].map(t=><option key={t}>{t}</option>)}</Sel>
        <div style={{position:"relative"}}>
          <Inp placeholder="ชื่อ เช่น PTT, SCBTECH, BTC" value={buyF.name}
            onChange={e=>{handleBuy("name",e.target.value);setShowNameDd(true);}}
            onFocus={()=>setShowNameDd(true)}
            onBlur={()=>setTimeout(()=>setShowNameDd(false),150)}
          />
          {showNameDd&&savedNames.filter(n=>n.toLowerCase().includes(buyF.name.toLowerCase())&&n!==buyF.name).length>0&&<div style={{position:"absolute",top:"100%",left:0,right:0,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,zIndex:100,maxHeight:150,overflowY:"auto",boxShadow:"0 4px 16px rgba(0,0,0,.4)"}}>
            {savedNames.filter(n=>n.toLowerCase().includes(buyF.name.toLowerCase())&&n!==buyF.name).map(n=><div key={n} style={{padding:"8px 12px",cursor:"pointer",fontSize:13,display:"flex",justifyContent:"space-between",alignItems:"center"}} onMouseDown={()=>{handleBuy("name",n);setShowNameDd(false);}}>
              <span>{n}</span>
              <span style={{fontSize:10,color:C.muted,cursor:"pointer"}} onMouseDown={e=>{e.stopPropagation();setSavedNames(p=>p.filter(x=>x!==n));}}>✕</span>
            </div>)}
          </div>}
        </div>
        <Inp type="date" value={buyF.date} onChange={e=>setBF(p=>({...p,date:e.target.value}))}/>
      </div>
      <div style={{background:C.surface,borderRadius:10,padding:"12px",marginBottom:8}}>
        <div style={{fontSize:11,color:C.amber,marginBottom:8}}>💡 กรอก 2 จาก 3 ค่า → ระบบคำนวณค่าที่เหลืออัตโนมัติ</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
          <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>จำนวนหน่วย / oz</div><Inp type="number" step="any" placeholder="คำนวณอัตโนมัติ" value={buyF.qty} onChange={e=>handleBuy("qty",e.target.value)}/></div>
          <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>ราคาต่อหน่วย</div><Inp type="number" step="any" placeholder="0" value={buyF.price} onChange={e=>handleBuy("price",e.target.value)}/></div>
          <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>ค่าธรรมเนียม</div><Inp type="number" step="any" placeholder="0" value={buyF.fee} onChange={e=>handleBuy("fee",e.target.value)}/></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:8,alignItems:"end"}}>
          <div><div style={{fontSize:11,color:C.amber,marginBottom:3}}>ยอดเงินรวม (กรอกแทนจำนวนหน่วยได้)</div><Inp type="number" step="any" placeholder="กรอกยอดรวม → คำนวณหน่วยให้" value={buyF.totalCost} onChange={e=>handleBuy("totalCost",e.target.value)} style={{borderColor:C.amber+"55"}}/></div>
          <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>สกุลเงิน</div><CurSel value={buyF.cur} onChange={v=>setBF(p=>({...p,cur:v}))} currencies={invCurrencies}/></div>
        </div>
      </div>
      <Btn onClick={addBuy} color={C.em}>🛒 บันทึกการซื้อ</Btn>
    </Card>

    {/* Portfolio */}
    <Card>
      <SL>พอร์ตการลงทุน</SL>
      {portfolio.length===0?<div style={{textAlign:"center",color:C.muted,padding:"1.5rem",fontSize:13}}>ยังไม่มีสินทรัพย์</div>:<>
        <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:10}}>
          <Donut slices={portfolio.map((p,i)=>({value:p.totalCost,color:Object.values(tC)[i%5]}))} size={80}/>
          <div style={{flex:1}}>{portfolio.map((p,i)=><div key={p.key} style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:2}}><span style={{color:Object.values(tC)[i%5]}}>● {p.name}</span><span style={{color:C.subtext}}>{fmtC(p.qty*getAvg(p.key),p.cur)}</span></div>)}</div>
        </div>
        <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr><TH>ประเภท</TH><TH>ชื่อ</TH><TH right>ถือครอง</TH><TH right>ต้นทุนเฉลี่ย</TH><TH right>มูลค่า</TH><TH>TradingView</TH></tr></thead>
          <tbody>{portfolio.map(p=>{const avg=getAvg(p.key);const tvUrl=`https://www.tradingview.com/chart/?symbol=${encodeURIComponent(p.type==="หุ้น"?"SET:"+p.name:p.name)}`;
            return<tr key={p.key}><TD><Badge label={p.type} color={tC[p.type]||C.muted}/></TD><TD style={{fontWeight:600}}>{p.name}</TD><TD right>{fmtN(p.qty,4)}</TD><TD right style={{color:C.amber}}>{fmtC(avg,p.cur)}</TD><TD right style={{fontWeight:600}}>{fmtC(p.qty*avg,p.cur)}</TD><TD><a href={tvUrl} target="_blank" rel="noopener noreferrer" style={{display:"inline-flex",gap:3,background:"#131722",color:"#fff",borderRadius:6,padding:"3px 9px",fontSize:11,textDecoration:"none",fontWeight:600}}>📈 TV</a></TD></tr>;
          })}</tbody>
        </table></div>
      </>}
    </Card>

    {/* Sell */}
    <Card>
      <SL>บันทึกการขาย</SL>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <Sel value={sellF.key} onChange={e=>setSF(p=>({...p,key:e.target.value,qty:"",price:"",fee:"",totalCost:""}))}>
          <option value="">-- เลือกสินทรัพย์ --</option>
          {portfolio.map(p=><option key={p.key} value={p.key}>{p.name} (ถือ {fmtN(p.qty,4)} | เฉลี่ย {fmtC(getAvg(p.key),p.cur)})</option>)}
        </Sel>
        <div style={{display:"flex",gap:6,alignItems:"end"}}><Inp type="date" value={sellF.date} onChange={e=>setSF(p=>({...p,date:e.target.value}))}/><CurSel value={sellF.cur} onChange={v=>setSF(p=>({...p,cur:v}))} currencies={invCurrencies}/></div>
      </div>
      <div style={{background:C.surface,borderRadius:10,padding:"12px",marginBottom:8}}>
        <div style={{fontSize:11,color:C.amber,marginBottom:8}}>💡 กรอก 2 จาก 3 ค่า → ระบบคำนวณค่าที่เหลืออัตโนมัติ</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
          <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>จำนวนที่ขาย</div><Inp type="number" step="any" placeholder="คำนวณอัตโนมัติ" value={sellF.qty} onChange={e=>handleSell("qty",e.target.value)}/></div>
          <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>ราคาขาย/หน่วย</div><Inp type="number" step="any" placeholder="0" value={sellF.price} onChange={e=>handleSell("price",e.target.value)}/></div>
          <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>ค่าธรรมเนียม</div><Inp type="number" step="any" placeholder="0" value={sellF.fee} onChange={e=>handleSell("fee",e.target.value)}/></div>
        </div>
        <div><div style={{fontSize:11,color:C.amber,marginBottom:3}}>ยอดเงินรวมที่ได้รับ (กรอกแทนจำนวนหน่วยได้)</div><Inp type="number" step="any" placeholder="กรอกยอดรวม → หาจำนวนหน่วยให้" value={sellF.totalCost} onChange={e=>handleSell("totalCost",e.target.value)} style={{borderColor:C.amber+"55"}}/></div>
      </div>
      {sellF.key&&(sellF.qty||sellF.totalCost)&&sellF.price&&(()=>{
        const avg=getAvg(sellF.key);
        const qty=parseFloat(sellF.qty)||0;
        const price=parseFloat(sellF.price)||0;
        const fee=parseFloat(sellF.fee)||0;
        const pnl=(price-avg)*qty-fee;
        const asset=portfolio.find(p=>p.key===sellF.key);
        return<div style={{fontSize:12,marginBottom:8,padding:"8px 12px",background:C.surface,borderRadius:8,display:"flex",gap:16,flexWrap:"wrap"}}>
          <span style={{color:pnl>=0?C.em:C.coral,fontWeight:700}}>คาดการณ์: {pnl>=0?"+":""}{fmtN(pnl,2)}</span>
          <span style={{color:C.muted}}>ต้นทุนเฉลี่ย: {fmtN(avg,4)}</span>
          {asset&&<span style={{color:C.muted}}>ถือครอง: {fmtN(asset.qty,4)} หน่วย</span>}
        </div>;
      })()}
      <Btn onClick={()=>addSell()} color={C.amber}>💰 บันทึกการขาย (เงินเข้า DIME TRADER)</Btn>
    </Card>

    {/* Currency Manager - bottom */}
    <Card style={{padding:"10px 14px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:C.muted}}>💱 สกุลเงิน (default: <span style={{color:C.em,fontWeight:600}}>{defCur}</span>):</span>
        <div style={{display:"flex",flexWrap:"wrap",gap:5,flex:1}}>
          {invCurrencies.map((c,i)=><div key={c} style={{background:C.surface,border:`1px solid ${i===0?C.em:C.border}`,borderRadius:99,padding:"2px 8px",fontSize:11,display:"flex",alignItems:"center",gap:4}}>
            {c}{i===0&&<span style={{color:C.em,fontSize:9}}>✓</span>}
            {i>0&&<IBtn onClick={()=>setInvCurrencies(p=>p.filter(x=>x!==c))} title="ลบ">✕</IBtn>}
          </div>)}
        </div>
        <div style={{display:"flex",gap:5}}>
          <Inp placeholder="เพิ่ม e.g. SGD" value={newCur} onChange={e=>setNC(e.target.value.toUpperCase())} style={{width:110,padding:"4px 8px",fontSize:11}}/>
          <Btn sm onClick={()=>{if(newCur.trim()&&!invCurrencies.includes(newCur)){setInvCurrencies(p=>[...p,newCur]);setNC("");}}}>+</Btn>
        </div>
      </div>
    </Card>

    {/* History */}
    <Card>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center",marginBottom:10}}>
        <SL style={{margin:0}}>ประวัติการซื้อขาย</SL>
        <div style={{display:"flex",gap:6,marginLeft:"auto",flexWrap:"wrap"}}>
          <Sel value={filterType} onChange={e=>setFT(e.target.value)} style={{width:110,padding:"4px 8px",fontSize:12}}>{assetTypes.map(t=><option key={t}>{t}</option>)}</Sel>
          <Sel value={filterAsset} onChange={e=>setFA(e.target.value)} style={{width:130,padding:"4px 8px",fontSize:12}}>{assetNames.map(n=><option key={n}>{n}</option>)}</Sel>
        </div>
      </div>
      {(()=>{
        // Sort by date ascending for running avg calculation
        const sorted=[...filteredTrades].sort((a,b)=>a.date.localeCompare(b.date));
        // Compute running avg cost per asset key
        const runningQty={},runningCost={};
        const rowsWithAvg=sorted.map(t=>{
          const k=t.key;
          if(!runningQty[k]){runningQty[k]=0;runningCost[k]=0;}
          let avgBefore=runningQty[k]>0?runningCost[k]/runningQty[k]:0;
          let pnlCalc=undefined;
          if(t.action==="buy"){
            runningQty[k]+=t.qty;
            runningCost[k]+=t.totalCost;
          } else {
            pnlCalc=(t.price-avgBefore)*t.qty-(t.fee||0);
            runningQty[k]=Math.max(0,runningQty[k]-t.qty);
            runningCost[k]=runningQty[k]*(runningQty[k]>0?avgBefore:0);
          }
          const avgAfter=runningQty[k]>0?runningCost[k]/runningQty[k]:0;
          return{...t,runningAvg:avgAfter,pnlCalc};
        });
        const realPnl=rowsWithAvg.filter(t=>t.action==="sell").reduce((s,t)=>s+(t.pnlCalc||0),0);
        return<div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr>
            <TH>วันที่</TH><TH>ประเภท</TH><TH>ชื่อ</TH>
            <TH right>จำนวน</TH><TH right>ราคา/หน่วย</TH>
            <TH right>ต้นทุนเฉลี่ย (หลังรายการ)</TH>
            <TH right>มูลค่า</TH><TH right>กำไร/ขาดทุน</TH><TH></TH>
          </tr></thead>
          <tbody>
            {rowsWithAvg.map(t=><tr key={t.id}>
              <TD style={{fontSize:11,color:C.muted}}>{t.date}</TD>
              <TD><Badge label={t.action==="buy"?"ซื้อ":"ขาย"} color={t.action==="buy"?C.em:C.coral}/></TD>
              <TD style={{fontWeight:600}}>{t.name} <span style={{fontSize:10,color:C.muted}}>{t.type}</span></TD>
              <TD right>{fmtN(t.qty,4)}</TD>
              <TD right>{fmtC(t.price,t.cur)}</TD>
              <TD right style={{color:C.amber}}>{t.runningAvg>0?fmtC(t.runningAvg,t.cur):"-"}</TD>
              <TD right>{fmtC(t.totalCost,t.cur)}</TD>
              <TD right>{t.action==="sell"&&t.pnlCalc!==undefined?<span style={{color:t.pnlCalc>=0?C.em:C.coral,fontWeight:700}}>{t.pnlCalc>=0?"+":""}{fmtN(t.pnlCalc,2)}</span>:"-"}</TD>
              <TD><IBtn onClick={()=>setInvestments(p=>p.filter(x=>x.id!==t.id))} title="ลบ">🗑</IBtn></TD>
            </tr>)}
            {rowsWithAvg.length===0&&<ERow cols={9} msg="ไม่มีรายการ"/>}
            {rowsWithAvg.length>0&&<tr style={{background:C.surface+"cc"}}>
              <td colSpan={7} style={{padding:"9px 8px",fontSize:13,fontWeight:700,color:C.subtext}}>
                📊 สรุป: {filterType}{filterAsset!=="ทั้งหมด"?" → "+filterAsset:""} · คิดตามวันที่จริง ({rowsWithAvg.filter(t=>t.action==="sell").length} รายการขาย)
              </td>
              <td style={{padding:"9px 8px",textAlign:"right",fontSize:15,fontWeight:800,color:realPnl>=0?C.em:C.coral}}>
                {realPnl>=0?"+":""}{fmtN(realPnl,2)}
              </td>
              <td></td>
            </tr>}
          </tbody>
        </table></div>;
      })()}
    </Card>
  </div>;
}

    const inst=installments.filter(i=>{const[sy,sm]=i.startMonth.split("-").map(Number);const d=(year-sy)*12+(m-(sm-1));return d>=0&&d<i.totalMonths;}).reduce((s,i)=>s+i.monthly,0);

// ── Google Sheets Sync Components ──
const SHEETS_URL_KEY="kpxf_sheets_url";

function SyncStatus({syncState}){
  if(!syncState||syncState==="idle")return null;
  const cfg={
    syncing:{bg:"#E8F4FF",color:"#1860A0",text:"กำลัง sync..."},
    ok:{bg:"#DCF5EB",color:"#0A6A40",text:"✓ Synced"},
    error:{bg:"#FDECEC",color:"#A03020",text:"⚠ Sync failed"},
  };
  const s=cfg[syncState]||cfg.idle;
  return<span style={{fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:20,background:s.bg,color:s.color}}>{s.text}</span>;
}

function SheetsSync({state,setAll,setSyncState}){
  const[url,setUrl]=React.useState(()=>localStorage.getItem(SHEETS_URL_KEY)||"");
  const[showCfg,setShowCfg]=React.useState(false);
  const[saving,setSaving]=React.useState(false);
  const[lastSync,setLastSync]=React.useState(()=>localStorage.getItem("fcc6_last_sync")||"");
  const stateRef=React.useRef(state);
  React.useEffect(()=>{stateRef.current=state;},[state]);

  const doPush=React.useCallback(async(s)=>{
    const ep=localStorage.getItem(SHEETS_URL_KEY);if(!ep)return false;
    try{
      const resp=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({v:6,ts:new Date().toISOString(),...(s||stateRef.current)})});
      const d=await resp.json();
      if(!d.ok)throw new Error(d.error||"sync failed");
      const t=new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
      localStorage.setItem("fcc6_last_sync",t);setLastSync(t);
      return true;
    }catch(e){console.error("Sync error",e);return false;}
  },[]);

  const doPull=React.useCallback(async()=>{
    const ep=localStorage.getItem(SHEETS_URL_KEY);if(!ep)return;
    setSyncState("syncing");
    try{
      const resp=await fetch(ep+"?ts="+Date.now());
      const d=await resp.json();
      if(!d.ok)throw new Error(d.error);
      setAll(d);
      const t=new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
      localStorage.setItem("fcc6_last_sync",t);setLastSync(t);
      setSyncState("ok");setTimeout(()=>setSyncState("idle"),3000);
    }catch(e){setSyncState("error");setTimeout(()=>setSyncState("idle"),4000);}
  },[setAll,setSyncState]);

  const doSyncNow=async()=>{
    const ep=localStorage.getItem(SHEETS_URL_KEY);
    if(!ep){setShowCfg(true);return;}
    setSyncState("syncing");
    const ok=await doPush();
    setSyncState(ok?"ok":"error");
    setTimeout(()=>setSyncState("idle"),ok?3000:4000);
  };

  // Auto-pull เมื่อเปิด app
  React.useEffect(()=>{
    const ep=localStorage.getItem(SHEETS_URL_KEY);
    if(ep)doPull();
  },[]);

  // Auto-push เมื่อปิด tab
  React.useEffect(()=>{
    const onUnload=()=>{
      const ep=localStorage.getItem(SHEETS_URL_KEY);if(!ep)return;
      try{
        const xhr=new XMLHttpRequest();
        xhr.open("POST",ep,false);
        xhr.setRequestHeader("Content-Type","application/json");
        xhr.send(JSON.stringify({v:6,ts:new Date().toISOString(),...stateRef.current}));
      }catch(e){}
    };
    window.addEventListener("beforeunload",onUnload);
    return()=>window.removeEventListener("beforeunload",onUnload);
  },[]);

  const saveUrl=()=>{
    localStorage.setItem(SHEETS_URL_KEY,url);
    setSaving(true);
    setTimeout(()=>{setSaving(false);setShowCfg(false);doPull();},400);
  };

  const isSetup=!!localStorage.getItem(SHEETS_URL_KEY);

  return<div style={{position:"relative",display:"flex",alignItems:"center",gap:6}}>
    {lastSync&&<span style={{fontSize:10,color:C.muted,whiteSpace:"nowrap"}}>sync {lastSync}</span>}
    <Btn sm color={isSetup?C.em:C.amber} style={{color:isSetup?C.ink:"#fff"}} onClick={doSyncNow}>
      {isSetup?"☁ Sync":"☁ ตั้งค่า"}
    </Btn>
    <button onClick={()=>setShowCfg(p=>!p)} title="ตั้งค่า Sheets"
      style={{background:"none",border:`0.5px solid ${C.border}`,borderRadius:8,padding:"4px 9px",
        cursor:"pointer",color:C.muted,fontSize:13,lineHeight:1}}>⚙</button>
    {showCfg&&<div style={{position:"fixed",top:58,right:12,background:C.card,
        border:`1px solid ${C.border}`,borderRadius:16,padding:"16px",width:320,
        zIndex:500,boxShadow:"0 8px 32px rgba(0,0,0,0.15)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{fontSize:13,fontWeight:700,color:C.text}}>☁ Google Sheets</span>
        <IBtn onClick={()=>setShowCfg(false)} title="ปิด">✕</IBtn>
      </div>
      <div style={{fontSize:11,color:C.muted,lineHeight:1.7,background:C.surface,
          borderRadius:8,padding:"8px 10px",marginBottom:10}}>
        <strong style={{color:C.text}}>ตั้งค่าครั้งแรก:</strong><br/>
        1. สร้าง Google Sheet ใหม่<br/>
        2. Extensions → Apps Script<br/>
        3. วาง code จาก apps-script.js<br/>
        4. Deploy → Web App → Copy URL<br/>
        5. วาง URL ด้านล่างแล้วกด บันทึก
      </div>
      <Inp placeholder="https://script.google.com/macros/s/..."
        value={url} onChange={e=>setUrl(e.target.value)}
        style={{marginBottom:8,fontSize:12}}/>
      <div style={{display:"flex",gap:6,marginBottom:isSetup?8:0}}>
        <Btn sm color={C.em} style={{color:C.ink,flex:1}} onClick={saveUrl}>
          {saving?"✓ บันทึกแล้ว!":"บันทึก URL"}
        </Btn>
        <Btn sm color={C.border} style={{color:C.subtext}} onClick={()=>setShowCfg(false)}>ยกเลิก</Btn>
      </div>
      {isSetup&&<div style={{display:"flex",gap:6}}>
        <Btn sm color={C.blue} style={{color:"#fff",flex:1}} onClick={()=>{doPull();setShowCfg(false);}}>⬇ Pull</Btn>
        <Btn sm color={C.violet} style={{color:"#fff",flex:1}} onClick={()=>{doSyncNow();setShowCfg(false);}}>⬆ Push</Btn>
      </div>}
      <div style={{fontSize:10,color:C.muted,marginTop:8,textAlign:"center"}}>
        Auto-sync เมื่อเปิด app และปิด tab อัตโนมัติ
      </div>
    </div>}
  </div>;
}

// PIN GATE — AES-256 via SubtleCrypto
// ══════════════════════════════════════════
const PIN_KEY="fcc6_pin_hash";
async function hashPIN(pin){
  const enc=new TextEncoder().encode(pin+"KPxFinance_salt_2026");
  const buf=await crypto.subtle.digest("SHA-256",enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function PINGate({children}){
  const[status,setStatus]=React.useState(()=>sessionStorage.getItem("fcc6_unlocked")==="1"?"unlocked":"locked");
  const[pin,setPin]=React.useState("");
  const[savedHash,setSavedHash]=React.useState(()=>localStorage.getItem(PIN_KEY)||"");
  const[mode,setMode]=React.useState(savedHash?"enter":"setup");
  const[err,setErr]=React.useState("");
  const[newPin,setNewPin]=React.useState("");
  const[newPin2,setNewPin2]=React.useState("");

  const doUnlock=async()=>{
    if(!savedHash){setMode("setup");return;}
    const h=await hashPIN(pin);
    if(h===savedHash){sessionStorage.setItem("fcc6_unlocked","1");setStatus("unlocked");setErr("");}
    else{setErr("PIN ไม่ถูกต้อง ลองใหม่");setPin("");}
  };
  const doSetup=async()=>{
    if(newPin.length<4){setErr("PIN ต้องมีอย่างน้อย 4 ตัว");return;}
    if(newPin!==newPin2){setErr("PIN ไม่ตรงกัน");return;}
    const h=await hashPIN(newPin);
    localStorage.setItem(PIN_KEY,h);setSavedHash(h);
    sessionStorage.setItem("fcc6_unlocked","1");setStatus("unlocked");setErr("");
  };
  const doLock=()=>{sessionStorage.removeItem("fcc6_unlocked");setStatus("locked");setPin("");};
  const doChangePIN=()=>{localStorage.removeItem(PIN_KEY);setSavedHash("");setMode("setup");setStatus("locked");setPin("");setNewPin("");setNewPin2("");};

  if(status==="unlocked")return<div style={{position:"relative"}}>{children}<button onClick={doLock} title="ล็อก app" style={{position:"fixed",bottom:18,right:18,background:C.card,border:`0.5px solid ${C.border}`,borderRadius:99,padding:"6px 12px",fontSize:11,color:C.muted,cursor:"pointer",zIndex:999}}>🔒 ล็อก</button></div>;

  return<div style={{minHeight:"100vh",background:C.ink,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:"2rem",width:"100%",maxWidth:320,textAlign:"center"}}>
      <div style={{fontSize:28,marginBottom:8}}>🔐</div>
      <div style={{fontSize:20,fontWeight:700,color:C.text,marginBottom:4}}>KPx<span style={{color:C.em}}>Finance</span></div>
      <div style={{fontSize:12,color:C.muted,marginBottom:20}}>{mode==="setup"?"ตั้ง PIN ครั้งแรก":"ใส่ PIN เพื่อเข้าใช้งาน"}</div>
      {mode==="enter"&&<>
        <input type="password" inputMode="numeric" maxLength={8} placeholder="● ● ● ●" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doUnlock()} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px",fontSize:24,textAlign:"center",width:"100%",outline:"none",letterSpacing:8,marginBottom:12,color:C.text}}/>
        {err&&<div style={{fontSize:12,color:C.coral,marginBottom:10}}>{err}</div>}
        <Btn onClick={doUnlock} style={{width:"100%",padding:"12px"}}>เข้าใช้งาน</Btn>
        <div style={{marginTop:12}}><button onClick={doChangePIN} style={{background:"none",border:"none",color:C.muted,fontSize:11,cursor:"pointer"}}>เปลี่ยน PIN</button></div>
      </>}
      {mode==="setup"&&<>
        <input type="password" inputMode="numeric" maxLength={8} placeholder="PIN ใหม่ (อย่างน้อย 4 ตัว)" value={newPin} onChange={e=>setNewPin(e.target.value)} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px",fontSize:18,textAlign:"center",width:"100%",outline:"none",marginBottom:8,color:C.text}}/>
        <input type="password" inputMode="numeric" maxLength={8} placeholder="ยืนยัน PIN" value={newPin2} onChange={e=>setNewPin2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSetup()} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px",fontSize:18,textAlign:"center",width:"100%",outline:"none",marginBottom:12,color:C.text}}/>
        {err&&<div style={{fontSize:12,color:C.coral,marginBottom:10}}>{err}</div>}
        <Btn onClick={doSetup} style={{width:"100%",padding:"12px"}}>ตั้ง PIN และเข้าใช้งาน</Btn>
      </>}
    </div>
  </div>;
}

// PENDING SLIP LIST  (localStorage)
// ══════════════════════════════════════════
const PENDING_KEY="fcc6_pending";
function usePending(){
  const[list,setList]=React.useState(()=>{try{return JSON.parse(localStorage.getItem(PENDING_KEY)||"[]");}catch{return[];}});
  const save=v=>{localStorage.setItem(PENDING_KEY,JSON.stringify(v));setList(v);};
  const add=item=>{const next=[...list,{...item,id:uid(),ts:new Date().toISOString()}];save(next);};
  const remove=id=>save(list.filter(x=>x.id!==id));
  return{list,add,remove};
}

function PendingApproveModal({modal,pockets,setPockets,setExpenses,setInstallments,setInvestments,payMethods,onClose,onDone}){
  const expCatList=["อาหาร","เดินทาง","สาธารณูปโภค","ความบันเทิง","สุขภาพ","การศึกษา","ช้อปปิ้ง","อื่นๆ"];
  const[cat,setCat]=React.useState(modal.category||expCatList[0]);
  const[method,setMethod]=React.useState("เงินสด");
  const[monthly,setMonthly]=React.useState("");
  const[months,setMonths]=React.useState("");
  const[month,setMonth]=React.useState(modal.date?modal.date.slice(0,7):thisMonth());
  const[fromPocket,setFromPocket]=React.useState("");
  const isInvest=!!(modal._inv);

  const doSave=(saveMode)=>{
    if(saveMode==="invest"&&modal._inv){
      // บันทึกการลงทุนจาก slip
      const d=modal._inv;
      const qty=parseFloat(d.qty)||0,price=parseFloat(d.price)||0,fee=parseFloat(d.fee)||0;
      if(d.action==="buy"){
        setInvestments(p=>[...p,{id:uid(),action:"buy",type:d.type||"หุ้น",name:d.name||"?",key:(d.name||"?").toUpperCase(),date:d.date||today(),qty,price,fee,totalCost:d.totalCost||qty*price+fee,cur:d.cur||"USD"}]);
        // deduct from pocket
        const pk=pockets.find(p=>p.id===fromPocket);
        if(pk)setPockets(p=>p.map(x=>x.id===pk.id?{...x,amount:Math.max(0,x.amount-(d.totalCost||qty*price+fee))}:x));
      } else {
        const avg=modal._avg||price;
        const pnl=(price-avg)*qty-fee;
        setInvestments(p=>[...p,{id:uid(),action:"sell",type:d.type||"หุ้น",name:d.name||"?",key:(d.name||"?").toUpperCase(),date:d.date||today(),qty,price,fee,totalCost:qty*price,pnl,cur:d.cur||"USD"}]);
        // credit DIME TRADER
        setPockets(prev=>{
          const dime=prev.find(p=>p.name==="DIME TRADER");
          const proceeds=qty*price-fee;
          if(dime)return prev.map(p=>p.name==="DIME TRADER"?{...p,amount:p.amount+proceeds}:p);
          return[...prev,{id:uid(),name:"DIME TRADER",amount:proceeds,goal:0,isMain:false,cur:"USD",color:"#E8A020"}];
        });
      }
    } else if(saveMode==="installment"){
      if(!monthly||!months){alert("กรุณากรอกยอดผ่อน/เดือนและจำนวนงวด");return;}
      setInstallments(p=>[...p,{id:uid(),name:modal.name||"จาก slip",category:cat,totalAmount:modal.amount,monthly:parseFloat(monthly),totalMonths:parseInt(months),startMonth:month,cur:"THB"}]);
    } else {
      // expense
      setExpenses(p=>[...p,{id:uid(),category:cat,desc:modal.name||"จาก slip",amount:modal.amount,month,cur:modal.cur||"THB",payMethod:method,ccDeferred:method==="บัตรเครดิต"}]);
      const pk=pockets.find(p=>p.name===method);
      if(pk)setPockets(p=>p.map(x=>x.id===pk.id?{...x,amount:Math.max(0,x.amount-modal.amount)}:x));
    }
    onDone();
  };
  return<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal-box">
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}><span style={{fontWeight:700,fontSize:15}}>อนุมัติรายการจาก Slip</span><IBtn onClick={onClose} title="ปิด">✕</IBtn></div>
      <div style={{background:C.surface,borderRadius:10,padding:"10px 12px",marginBottom:12}}>
        <div style={{fontWeight:600,color:C.text}}>{modal.name}</div>
        <div style={{fontSize:13,color:C.coral,fontWeight:700}}>{fmt(modal.amount)}</div>
        <div style={{fontSize:11,color:C.muted}}>{modal.type} · {modal.date}</div>
      </div>
      <div style={{marginBottom:8}}><div style={{fontSize:11,color:C.muted,marginBottom:3}}>หมวดหมู่</div><Sel value={cat} onChange={e=>setCat(e.target.value)}>{expCatList.map(c=><option key={c}>{c}</option>)}</Sel></div>
      <div style={{marginBottom:8}}><div style={{fontSize:11,color:C.muted,marginBottom:3}}>เดือน</div><Inp type="month" value={month} onChange={e=>setMonth(e.target.value)}/></div>
      {isInvest&&<>
        <div style={{background:"#DCF5EB22",border:"0.5px solid #1DB87040",borderRadius:8,padding:"8px 10px",marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:600,color:C.em,marginBottom:4}}>📊 ข้อมูลการลงทุนจาก Slip</div>
          {modal._inv&&<div style={{fontSize:11,color:C.subtext,lineHeight:1.8}}>
            ประเภท: {modal._inv.type} · ชื่อ: {modal._inv.name} · {modal._inv.action==="buy"?"ซื้อ":"ขาย"}<br/>
            จำนวน: {modal._inv.qty} หน่วย · ราคา: {fmtC(modal._inv.price||0,modal._inv.cur||"USD")} · รวม: {fmtC(modal._inv.totalCost||0,modal._inv.cur||"USD")}
          </div>}
        </div>
        {modal._inv?.action==="buy"&&<div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:C.muted,marginBottom:3}}>หักเงินจาก Pocket</div>
          <Sel value={fromPocket} onChange={e=>setFromPocket(e.target.value)}>
            <option value="">-- ไม่หักจาก Pocket --</option>
            {pockets.map(p=><option key={p.id} value={p.id}>{p.name} ({fmt(p.amount)})</option>)}
          </Sel>
        </div>}
        {modal._inv?.action==="sell"&&<div style={{padding:"8px 10px",background:"#E8A02015",borderRadius:8,marginBottom:10,fontSize:12,color:C.amber}}>
          💰 เงินที่ได้จากการขายจะเข้า <strong>DIME TRADER</strong> pocket อัตโนมัติ
        </div>}
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn onClick={()=>doSave("invest")} color={C.em}>✓ บันทึกการลงทุน</Btn>
          <Btn onClick={onClose} color={C.border} style={{color:C.text}}>ยกเลิก</Btn>
        </div>
      </>}
      {!isInvest&&<>
        {modal.mode==="expense"&&<div style={{marginBottom:12}}><div style={{fontSize:11,color:C.muted,marginBottom:3}}>ช่องทางชำระ</div><Sel value={method} onChange={e=>setMethod(e.target.value)}>{payMethods.map(m=><option key={m}>{m}</option>)}</Sel></div>}
        {modal.mode==="installment"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>ผ่อน/เดือน</div><Inp type="number" value={monthly} onChange={e=>setMonthly(e.target.value)}/></div>
          <div><div style={{fontSize:11,color:C.muted,marginBottom:3}}>จำนวนงวด</div><Inp type="number" value={months} onChange={e=>setMonths(e.target.value)}/></div>
        </div>}
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn onClick={()=>doSave("expense")} color={C.em}>✓ บันทึกรายจ่าย</Btn>
          <Btn onClick={()=>doSave("installment")} color={C.amber} style={{color:C.ink}}>บันทึกเป็นยอดผ่อน</Btn>
          <Btn onClick={onClose} color={C.border} style={{color:C.text}}>ยกเลิก</Btn>
        </div>
      </>}
    </div>
  </div>;
}
