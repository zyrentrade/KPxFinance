function SummaryTab({incomes,expenses,installments,fxRates,setFxRates,incomeSources}){
  const[year,setYear]=useState(new Date().getFullYear());
  const months=Array.from({length:12},(_,i)=>i);
  const COLS=["var(--coral)","var(--violet)","var(--amber)","var(--em)","var(--blue)","#FF8C42","#D4537E"];
  const data=useMemo(()=>months.map(m=>{
    const mk=year+"-"+String(m+1).padStart(2,"0");
    const inc=incomes.filter(e=>e.month===mk).reduce((s,e)=>s+baseValue(e,fxRates),0);
    const exp=expenses.filter(e=>e.month===mk).reduce((s,e)=>s+baseValue(e,fxRates),0);
    const inst=installments.filter(i=>{const[sy,sm]=i.startMonth.split("-").map(Number);const d=(year-sy)*12+(m-(sm-1));return d>=0&&d<i.totalMonths;}).reduce((s,i)=>s+baseValue({amount:i.monthly,cur:i.cur},fxRates),0);
    return{mk,label:mLbl(mk),inc,exp:exp+inst,bal:inc-exp-inst};
  }),[incomes,expenses,installments,year,fxRates]);
  const totI=data.reduce((s,d)=>s+d.inc,0),totE=data.reduce((s,d)=>s+d.exp,0),totB=totI-totE;
  const sr=totI>0?clamp(Math.round(totB/totI*100),0,100):0;
  const incomeBySource=useMemo(()=>{const m={};incomes.filter(i=>i.month?.startsWith(String(year))).forEach(i=>{const n=incomeSources.find(s=>s.id===i.sourceId)?.name||"ไม่ระบุแหล่ง";m[n]=(m[n]||0)+baseValue(i,fxRates);});return Object.entries(m).sort((a,b)=>b[1]-a[1]);},[incomes,year,incomeSources,fxRates]);
  const expCY=useMemo(()=>{const m={};expenses.filter(e=>e.month.startsWith(String(year))).forEach(e=>{m[e.category]=(m[e.category]||0)+baseValue(e,fxRates);});installments.forEach(inst=>{months.forEach(mo=>{const[sy,sm]=inst.startMonth.split("-").map(Number);const d=(year-sy)*12+(mo-(sm-1));if(d>=0&&d<inst.totalMonths)m["ผ่อนชำระ"]=(m["ผ่อนชำระ"]||0)+baseValue({amount:inst.monthly,cur:inst.cur},fxRates);});});return m;},[expenses,installments,year,fxRates]);
  return<div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
    <Card style={{borderColor:"var(--blue)44"}}>
      <SL>อัตราแลกเปลี่ยนสำหรับรายงาน (1 หน่วย = บาท)</SL>
      <div className="fg3">{Object.entries(fxRates).map(([cur,rate])=><FW key={cur} label={cur}><Inp type="number" step="any" value={rate} disabled={cur==="THB"} onChange={e=>setFxRates(p=>({...p,[cur]:asNum(e.target.value)}))}/></FW>)}</div>
      <div style={{fontSize:11,color:"var(--muted)",marginTop:8}}>รายงานทั้งหมดแปลงเป็น THB ตามอัตราที่บันทึกไว้ในรายการใหม่ หรืออัตรานี้สำหรับข้อมูลเดิม</div>
    </Card>
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <span style={{fontSize:12,color:"var(--muted)",fontWeight:600}}>ปี</span>
      <Sel value={year} onChange={e=>setYear(parseInt(e.target.value))} style={{width:100}}>{[2022,2023,2024,2025,2026,2027,2028].map(y=><option key={y}>{y}</option>)}</Sel>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:8}}>
      <div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"1rem"}}><SL>รายรับรวม</SL><div style={{fontSize:20,fontWeight:700,color:"var(--em)"}}>{fmt(totI)}</div></div>
      <div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"1rem"}}><SL>รายจ่ายรวม</SL><div style={{fontSize:20,fontWeight:700,color:"var(--coral)"}}>{fmt(totE)}</div></div>
      <div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"1rem"}}><SL>ออมสะสม</SL><div style={{fontSize:20,fontWeight:700,color:totB>=0?"var(--violet)":"var(--coral)"}}>{fmt(totB)}</div></div>
      <div style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"1rem"}}><SL>อัตราออม</SL><div style={{fontSize:20,fontWeight:700,color:sr>=20?"var(--em)":sr>=10?"var(--amber)":"var(--coral)"}}>{sr}%</div><div style={{fontSize:11,color:"var(--muted)",marginTop:2}}>{sr>=20?"ดีมาก":sr>=10?"พอใช้":"ควรปรับ"}</div></div>
    </div>
    {incomeBySource.length>0&&<Card><SL>รายรับแยกตามแหล่ง · {year}</SL>{incomeBySource.map(([name,amount])=>{const pct=totI?amount/totI*100:0;return <div key={name} style={{marginBottom:9}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{color:"var(--tx)"}}>{name}</span><span style={{color:"var(--em)",fontWeight:700}}>{fmt(amount)}</span></div><PBar pct={pct} col="var(--em)" h={5}/></div>;})}</Card>}
    <Card>
      <SL>รายรับ vs รายจ่าย {year}</SL>
      <div style={{display:"flex",alignItems:"flex-end",gap:3,height:90,marginBottom:6}}>
        {data.map((d,i)=>{const max=Math.max(...data.map(x=>Math.max(x.inc,x.exp)),1);return<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
          <div style={{width:"100%",display:"flex",gap:1,alignItems:"flex-end",height:72}}>
            <div style={{flex:1,background:"var(--em)",borderRadius:"2px 2px 0 0",height:`${(d.inc/max)*100}%`,minHeight:1,opacity:.85}}/>
            <div style={{flex:1,background:"var(--coral)",borderRadius:"2px 2px 0 0",height:`${(d.exp/max)*100}%`,minHeight:1,opacity:.85}}/>
          </div>
          <div style={{fontSize:9,color:"var(--muted)"}}>{d.label.replace(/\s.*/,"")}</div>
        </div>;})}
      </div>
      <div style={{display:"flex",gap:12}}><span style={{fontSize:11,color:"var(--em)"}}>● รายรับ</span><span style={{fontSize:11,color:"var(--coral)"}}>● รายจ่าย</span></div>
    </Card>
    <Card>
      <SL>แนวโน้มเงินออม</SL>
      {(()=>{let cum=0;const pts=data.map(d=>{cum+=d.bal;return cum;});const mn=Math.min(...pts,0),mx=Math.max(...pts,1),rng=mx-mn||1,W=100,H=50;const px=i=>(i/(pts.length-1))*W,py=v=>H-((v-mn)/rng)*H;const pathD=pts.map((v,i)=>`${i===0?"M":"L"} ${px(i)} ${py(v)}`).join(" ");
        return<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:70}}>
          <defs><linearGradient id="sg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--violet)" stopOpacity=".3"/><stop offset="100%" stopColor="var(--violet)" stopOpacity="0"/></linearGradient></defs>
          <path d={pathD+` L ${W} ${H} L 0 ${H} Z`} fill="url(#sg2)"/>
          <path d={pathD} fill="none" stroke="var(--violet)" strokeWidth="1.5"/>
          {pts.map((v,i)=><circle key={i} cx={px(i)} cy={py(v)} r="1.8" fill={v>=0?"var(--violet)":"var(--coral)"}/>)}
        </svg>;})()}
    </Card>
    {Object.keys(expCY).length>0&&<Card>
      <SL>รายจ่ายตามหมวด</SL>
      <div style={{display:"flex",gap:14,alignItems:"center"}}>
        <Donut slices={Object.entries(expCY).map(([k,v],i)=>({value:v,color:COLS[i%COLS.length]}))} size={90}/>
        <div style={{flex:1}}>{Object.entries(expCY).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>{const pct=totE>0?Math.round(v/totE*100):0;return<div key={k} style={{marginBottom:6}}><div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:2}}><span style={{color:COLS[i%COLS.length]}}>● {k}</span><span style={{color:"var(--muted)"}}>{fmt(v)} ({pct}%)</span></div><PBar pct={pct} col={COLS[i%COLS.length]} h={4}/></div>;})}</div>
      </div>
    </Card>}
    <Card>
      <SL>ตารางรายเดือน</SL>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr><TH>เดือน</TH><TH right>รายรับ</TH><TH right>รายจ่าย</TH><TH right>คงเหลือ</TH><TH>%ใช้จ่าย</TH></tr></thead>
        <tbody>{data.map(d=>{const pct=d.inc>0?clamp(Math.round(d.exp/d.inc*100),0,100):0;return<tr key={d.mk}><TD style={{fontWeight:600,color:"var(--tx)"}}>{d.label}</TD><TD right style={{color:"var(--em)"}}>{fmt(d.inc)}</TD><TD right style={{color:"var(--coral)"}}>{fmt(d.exp)}</TD><TD right style={{color:d.bal>=0?"var(--em)":"var(--coral)",fontWeight:600}}>{fmt(d.bal)}</TD><TD style={{minWidth:80}}><PBar pct={pct} col={pct>90?"var(--coral)":pct>70?"var(--amber)":"var(--em)"} h={5}/></TD></tr>;})}</tbody>
      </table></div>
    </Card>
  </div>;
}

  const[envelopes,setEnvelopes]=useLS("kpxf_envelopes",DEF_ENVELOPES);
  const[tab,setTab]=useState("home"); // mobile uses string id
  const[deskTab,setDeskTab]=useState(0); // desktop uses index
  const[syncState,setSyncState]=useState("idle");
  const[showMore,setShowMore]=useState(false);
  const mobile=useIsMobile();
  const currencies=["THB","USD","EUR","JPY","GBP","SGD"];

  // Ensure critical pockets always exist
  useEffect(()=>{
    let p=[...pockets],upd=false;
    if(!p.find(x=>x.isMain)){p=[{id:MAIN_PID,name:"Cash Box",amount:0,goal:0,isMain:true},...p];upd=true;}
    if(!p.find(x=>x.id===TRADER_PID||x.name==="TRADER")){p=[...p,{id:TRADER_PID,name:"TRADER",amount:0,goal:0,isMain:false}];upd=true;}
    if(upd)setPockets(p);
  },[]);

  // Keep stateRef current for SheetsSync
  const stateRef=useRef();
  const state={schemaVersion:10,incomes,expenses,installments,instPayments,ccPayments,pockets,envelopes,investments,incCats,incomeSources,expCats,transfers,invCurrencies,fxRates};
  stateRef.current=state;
  const getState=useCallback(()=>stateRef.current,[]);
  const setAll=useCallback(d=>{
    if(d.incomes)setIncomes(d.incomes);if(d.expenses)setExpenses(d.expenses);
    if(d.installments)setInstallments(d.installments);if(d.instPayments)setInstPayments(d.instPayments);
    if(d.ccPayments)setCcPayments(d.ccPayments);if(d.pockets)setPockets(d.pockets);
    if(d.investments)setInvestments(d.investments);if(d.incCats)setIncCats(d.incCats);
    if(d.expCats)setExpCats(d.expCats);if(d.incomeSources)setIncomeSources(d.incomeSources);if(d.envelopes)setEnvelopes(d.envelopes);if(d.transfers)setTransfers(d.transfers);
    if(d.invCurrencies)setInvCurrencies(d.invCurrencies);if(d.fxRates)setFxRates(d.fxRates);
  },[]);

  // Badge counts
  const pendExp=pendingItems.filter(x=>x.source==="expense").length;
  const pendInv=pendingItems.filter(x=>x.source==="invest").length;
  const totalPend=pendingItems.length;

  // Mobile tab → setTab helper (also used by MobileHome quick actions)
  const goTab=useCallback(id=>{
    if(MORE_TABS.find(t=>t.id===id)){setShowMore(false);}
    setTab(id);
  },[]);

  // Desktop tab badge
  const deskBadge=i=>{const id=DESK_TABS[i].id;if(id==="expense")return pendExp;if(id==="invest")return pendInv;return 0;};

  // Shared tab content renderer
  const renderContent=(tabId)=>{
    const props={
      expenses,setExpenses,expCats,setExpCats,
      installments,setInstallments,instPayments,setInstPayments,
      ccPayments,setCcPayments,pockets,setPockets,
      currencies,pendingItems,setPendingItems,fxRates
    };
    switch(tabId){
      case "home": return<MobileHome incomes={incomes} expenses={expenses} installments={installments} pockets={pockets} setPockets={setPockets} pendingItems={pendingItems} setPendingItems={setPendingItems} setExpenses={setExpenses} setInstallments={setInstallments} investments={investments} setInvestments={setInvestments} savedNames={savedNames} setSavedNames={setSavedNames} setTab={goTab}/>;
      case "overview": return<DesktopOverview incomes={incomes} expenses={expenses} installments={installments} instPayments={instPayments} pockets={pockets}/>;
      case "summary": return<SummaryTab incomes={incomes} expenses={expenses} installments={installments} fxRates={fxRates} setFxRates={setFxRates} incomeSources={incomeSources}/>;
      case "income": return<IncomeTab incomes={incomes} setIncomes={setIncomes} cats={incCats} setCats={setIncCats} pockets={pockets} setPockets={setPockets} currencies={currencies} incomeSources={incomeSources} setIncomeSources={setIncomeSources} fxRates={fxRates}/>;
      case "expense": return<ExpenseTab {...props}/>;
      case "saving": return<SavingTab pockets={pockets} setPockets={setPockets} transfers={transfers} setTransfers={setTransfers} envelopes={envelopes} setEnvelopes={setEnvelopes}/>;
      case "invest": return<InvestTab investments={investments} setInvestments={setInvestments} invCurrencies={invCurrencies} setInvCurrencies={setInvCurrencies} pockets={pockets} setPockets={setPockets} pendingItems={pendingItems} setPendingItems={setPendingItems}/>;
      default: return null;
    }
  };

  /* ── MOBILE LAYOUT ── */
  if(mobile){
    const activeTabId=tab==="more"?"home":tab;
    return<ToastProvider>
      <div style={{background:"var(--bg)",minHeight:"100vh"}}>
        {/* Mobile header */}
        <div style={{background:"var(--card)",borderBottom:"0.5px solid var(--bd)",padding:"max(env(safe-area-inset-top),10px) 16px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:700}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:17,fontWeight:800,color:"var(--tx)"}}>KPx<span style={{color:"var(--em)"}}>Finance</span></span>
            <SyncBadge s={syncState}/>
          </div>
          <SheetsSync getState={getState} setAll={setAll} setSS={setSyncState}/>
        </div>

        {/* Page content */}
        <div className="mppad" style={{padding:"12px 12px 0"}}>
          {tab==="more"
            ? /* More drawer */
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                <div style={{fontSize:16,fontWeight:700,color:"var(--tx)",marginBottom:4}}>ทบทวนและเพิ่มเติม</div>
                {MORE_TABS.map(t=><div key={t.id} onClick={()=>goTab(t.id)} style={{background:"var(--card)",border:"0.5px solid var(--bd)",borderRadius:14,padding:"16px",display:"flex",alignItems:"center",gap:14,cursor:"pointer"}}>
                  <span style={{fontSize:26}}>{t.icon}</span>
                  <span style={{fontSize:15,fontWeight:600,color:"var(--tx)"}}>{t.label}</span>
                </div>)}
              </div>
            : renderContent(tab)
          }
        </div>

        {/* Bottom nav */}
        <nav className="bnav">
          {MOB_TABS.map(t=>{
            const isActive=tab===t.id||(t.id==="more"&&tab==="more");
            const badge=t.id==="expense"?pendExp:t.id==="invest"?pendInv:t.id==="more"&&MORE_TABS.some(m=>m.id==="income")?0:0;
            return<button key={t.id} className={isActive?"act":""} onClick={()=>{if(t.id==="more"){setTab("more");}else{goTab(t.id);}}}>
              <span className="ni">{t.icon}</span>{t.label}
              {badge>0&&<span style={{position:"absolute",top:2,right:"50%",transform:"translateX(10px)",background:"var(--amber)",color:"var(--ink)",borderRadius:99,fontSize:8,fontWeight:800,padding:"1px 4px",minWidth:14,textAlign:"center"}}>{badge}</span>}
            </button>;
          })}
        </nav>
      </div>
    </ToastProvider>;
  }

  /* ── DESKTOP LAYOUT ── */
  const deskTabId=DESK_TABS[deskTab]?.id||"overview";
  const currentDesk=DESK_TABS[deskTab]||DESK_TABS[0];
  return<ToastProvider>
    <div className="hybrid-shell">
      <aside className="hybrid-side">
        <div className="hybrid-brand">KP<b>x</b> Finance</div>
        <div className="hybrid-nav">
          {DESK_TABS.map((t,i)=>{const active=deskTab===i;const b=deskBadge(i);return <button key={t.id} className={i===5?"secondary "+(active?"active":""):active?"active":""} onClick={()=>setDeskTab(i)}>{t.label}{b>0&&<span style={{float:"right",background:"var(--amber)",color:"var(--ink)",borderRadius:99,fontSize:9,padding:"1px 5px"}}>{b}</span>}</button>;})}
        </div>
        <div className="hybrid-side-note"><b>รอบทบทวนสัปดาห์นี้</b>ยังมี slip  {totalPend} รายการรอยืนยัน และมีเงินที่ยังไม่จัดสรรให้ CloudPocket</div>
      </aside>
      <main className="hybrid-main">
        <div className="hybrid-top"><div><div className="hybrid-kicker">{currentDesk.kicker}</div><div className="hybrid-title">{currentDesk.label}</div></div><div style={{display:"flex",gap:9,alignItems:"center"}}><SyncBadge s={syncState}/><SheetsSync getState={getState} setAll={setAll} setSS={setSyncState}/><button className="hybrid-action" onClick={()=>setDeskTab(DESK_TABS.findIndex(t=>t.id==="expense"))}>+ บันทึกรายการ</button></div></div>
        {renderContent(deskTabId)}
      </main>
    </div>
  </ToastProvider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
